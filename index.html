<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Algo World 3D - Bug Hunter</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in-up { animation: fadeInUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        
        @keyframes popIn {
            0% { transform: scale(0.8); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
        .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }

        @keyframes float {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }
            100% { transform: translateY(0px); }
        }
        .animate-float { animation: float 3s ease-in-out infinite; }

        /* 3D Button Effekte */
        .btn-3d {
            transition: all 0.1s;
            box-shadow: 0 8px 0 rgba(0,0,0,0.2);
        }
        .btn-3d:active:not(:disabled) {
            transform: translateY(8px);
            box-shadow: 0 0px 0 rgba(0,0,0,0.2);
        }
        
        /* Island 3D Effekt für die Übersichtskarte */
        .island-3d {
            box-shadow: 0 15px 0 rgba(0,0,0,0.15), 0 20px 25px -5px rgba(0,0,0,0.1);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .island-3d:hover:not(:disabled) {
            transform: translateY(-5px);
            box-shadow: 0 20px 0 rgba(0,0,0,0.15), 0 25px 30px -5px rgba(0,0,0,0.2);
        }
        .island-3d:active:not(:disabled) {
            transform: translateY(10px);
            box-shadow: 0 5px 0 rgba(0,0,0,0.15), 0 10px 10px -5px rgba(0,0,0,0.2);
        }

        /* Glitch Effekt für Welt 9 */
        .glitch-text {
            text-shadow: 2px 2px #ff00ff, -2px -2px #00ffff;
        }

        /* Neon Blau Schrift */
        .neon-blue-text {
            color: #0ff;
            text-shadow: 0 0 5px #0ff, 0 0 10px #0ff, 0 0 20px #0ff;
        }
    </style>
</head>
<body class="bg-sky-200 overflow-x-hidden font-sans">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- HILFS-KOMPONENTEN ---
        const Button3D = ({ children, onClick, color = "blue", className = "", disabled = false }) => {
            const colorMap = {
                blue: "bg-blue-500 hover:bg-blue-400 text-white",
                green: "bg-green-500 hover:bg-green-400 text-white",
                red: "bg-red-500 hover:bg-red-400 text-white",
                yellow: "bg-yellow-400 hover:bg-yellow-300 text-yellow-900",
                purple: "bg-purple-500 hover:bg-purple-400 text-white",
                gray: "bg-gray-400 hover:bg-gray-300 text-white",
                black: "bg-gray-900 hover:bg-gray-800 text-green-400 border-2 border-green-500",
            };
            return (
                <button 
                    onClick={onClick} 
                    disabled={disabled}
                    className={`btn-3d w-full py-4 font-bold text-xl rounded-2xl ${colorMap[color]} ${disabled ? 'opacity-50 cursor-not-allowed transform-none shadow-none' : ''} ${className}`}
                >
                    {children}
                </button>
            );
        };

        const DialogBox = ({ title, icon, children, color = "blue" }) => {
            const borders = { blue: "border-blue-300", yellow: "border-yellow-300", red: "border-red-300", green: "border-green-300", purple: "border-purple-300", teal: "border-teal-300", orange: "border-orange-300", black: "border-green-500" };
            const bgs = { blue: "bg-blue-50", yellow: "bg-yellow-50", red: "bg-red-50", green: "bg-green-50", purple: "bg-purple-50", teal: "bg-teal-50", orange: "bg-orange-50", black: "bg-gray-900" };
            const texts = { blue: "text-blue-800", yellow: "text-yellow-800", red: "text-red-800", green: "text-green-800", purple: "text-purple-800", teal: "text-teal-800", orange: "text-orange-800", black: "text-green-400" };
            const textBase = color === 'black' ? 'text-green-300 font-mono' : 'text-gray-700 font-medium';

            return (
                <div className={`${bgs[color]} p-6 rounded-3xl border-b-8 border-x-4 border-t-4 ${borders[color]} mb-6 shadow-lg`}>
                    <h3 className={`font-black text-2xl ${texts[color]} mb-4 flex items-center gap-3`}>
                        <i className={`fa-solid ${icon} text-3xl`}></i> {title}
                    </h3>
                    <div className={`space-y-4 ${textBase}`}>
                        {children}
                    </div>
                </div>
            );
        };

        // --- UNSERE SPIELFIGUR ALGO ---
        const AlgoCharacter = () => (
            <div className="relative flex flex-col items-center animate-bounce z-50 hover:scale-110 transition-transform cursor-pointer" style={{ filter: 'drop-shadow(0px 6px 4px rgba(0,0,0,0.4))' }}>
                <div className="absolute -top-8 bg-white text-[10px] font-black px-2 py-1 rounded-full border-2 border-emerald-400 shadow-sm text-emerald-600 whitespace-nowrap">Ich bin Algo!</div>
                
                {/* Zettel Körper */}
                <div className="relative bg-yellow-50 w-12 h-16 border-4 border-gray-500 flex flex-col items-center justify-start pt-3 z-10 shadow-inner rounded-sm">
                    {/* Eselsohr oben rechts */}
                    <div className="absolute -top-1 -right-1 w-0 h-0 border-l-[12px] border-l-transparent border-b-[12px] border-b-gray-400"></div>
                    <div className="absolute -top-1 -right-1 w-0 h-0 border-r-[12px] border-r-sky-300 border-t-[12px] border-t-sky-300"></div>
                    
                    {/* Augen */}
                    <div className="flex gap-2 mb-1 z-20">
                        <div className="w-2 h-2 bg-black rounded-full"></div>
                        <div className="w-2 h-2 bg-black rounded-full"></div>
                    </div>
                    {/* Lächeln */}
                    <div className="w-4 h-2 border-b-4 border-black rounded-full mb-2"></div>
                    
                    {/* Code-Linien auf dem Zettel */}
                    <div className="w-8 h-1 bg-gray-300 mb-1 rounded"></div>
                    <div className="w-6 h-1 bg-gray-300 mb-1 rounded"></div>
                    <div className="w-7 h-1 bg-gray-300 rounded"></div>
                </div>
            </div>
        );

        // --- HINTERGRÜNDE FÜR DIE WELTEN-MAPS ---
        const WorldBackground = ({ worldId }) => {
            switch(worldId) {
                case 1: // Grasland
                    return (
                        <div className="absolute inset-0 bg-sky-300 overflow-hidden pointer-events-none">
                            <div className="absolute top-10 left-20 text-white opacity-80 animate-float"><i className="fa-solid fa-cloud text-6xl"></i></div>
                            <div className="absolute top-32 right-10 text-white opacity-60 animate-float" style={{animationDelay:'1s'}}><i className="fa-solid fa-cloud text-8xl"></i></div>
                            <div className="absolute -bottom-32 -left-20 w-[150%] h-64 bg-green-500 rounded-[100%] border-t-8 border-green-600"></div>
                            <div className="absolute -bottom-40 right-10 w-96 h-80 bg-green-400 rounded-[100%] border-t-8 border-green-500"></div>
                        </div>
                    );
                case 2: // Wüste
                    return (
                        <div className="absolute inset-0 bg-orange-200 overflow-hidden pointer-events-none">
                            <div className="absolute top-10 left-1/4 text-yellow-100 opacity-90 animate-pulse"><i className="fa-solid fa-sun text-8xl"></i></div>
                            <div className="absolute -bottom-20 -left-20 w-[120%] h-64 bg-yellow-500 rounded-[100%] border-t-8 border-yellow-600"></div>
                            <div className="absolute -bottom-32 right-0 w-96 h-80 bg-yellow-400 rounded-[100%] border-t-8 border-yellow-500"></div>
                        </div>
                    );
                case 3: // Wasserfall
                    return (
                        <div className="absolute inset-0 bg-blue-200 overflow-hidden pointer-events-none">
                            <div className="absolute top-0 right-1/3 w-32 h-full bg-blue-400 opacity-60"></div>
                            <div className="absolute top-0 right-1/3 w-8 h-full bg-blue-300 opacity-80 animate-pulse"></div>
                            <div className="absolute -bottom-20 -left-20 w-[150%] h-40 bg-blue-600 rounded-[100%] border-t-8 border-blue-700"></div>
                        </div>
                    );
                case 4: // Dschungel
                    return (
                        <div className="absolute inset-0 bg-emerald-800 overflow-hidden pointer-events-none">
                            <div className="absolute -top-20 -left-10 w-64 h-64 bg-emerald-600 rounded-full border-b-8 border-emerald-700"></div>
                            <div className="absolute -bottom-20 -left-20 w-[150%] h-64 bg-emerald-900 rounded-[100%] border-t-8 border-emerald-950"></div>
                        </div>
                    );
                case 5: // Eiswelt
                    return (
                        <div className="absolute inset-0 bg-cyan-100 overflow-hidden pointer-events-none">
                            <div className="absolute top-10 left-10 text-white animate-float"><i className="fa-regular fa-snowflake text-4xl"></i></div>
                            <div className="absolute -bottom-20 -left-20 w-[120%] h-64 bg-white rounded-[100%] border-t-8 border-cyan-200"></div>
                        </div>
                    );
                case 6: // Wolkenstadt
                    return (
                        <div className="absolute inset-0 bg-sky-200 overflow-hidden pointer-events-none">
                            <div className="absolute top-20 left-10 text-white opacity-90 animate-float"><i className="fa-solid fa-cloud text-8xl"></i></div>
                            <div className="absolute -bottom-10 -left-10 w-64 h-64 bg-white rounded-full border-t-8 border-gray-100"></div>
                        </div>
                    );
                case 7: // Lavaburg
                    return (
                        <div className="absolute inset-0 bg-red-950 overflow-hidden pointer-events-none">
                            <div className="absolute bottom-10 left-10 w-64 h-64 bg-red-600 rounded-full blur-3xl opacity-40"></div>
                            <div className="absolute -bottom-20 -left-20 w-[150%] h-40 bg-gray-900 rounded-[100%] border-t-8 border-orange-600"></div>
                        </div>
                    );
                case 8: // Sternenwelt
                    return (
                        <div className="absolute inset-0 bg-indigo-950 overflow-hidden pointer-events-none">
                            <div className="absolute top-10 left-10 text-yellow-200 opacity-80 animate-pulse"><i className="fa-solid fa-star"></i></div>
                            <div className="absolute -bottom-40 -left-20 w-[150%] h-64 bg-purple-900 rounded-[100%] border-t-8 border-fuchsia-700"></div>
                        </div>
                    );
                case 9: // EXPERTEN WELT (Neon Matrix)
                    return (
                        <div className="absolute inset-0 bg-black overflow-hidden pointer-events-none">
                            {/* Matrix Grid */}
                            <div className="absolute inset-0" style={{
                                backgroundImage: 'linear-gradient(rgba(0, 255, 0, 0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 0, 0.2) 1px, transparent 1px)',
                                backgroundSize: '40px 40px',
                                transform: 'perspective(500px) rotateX(60deg) translateY(100px) translateZ(-200px)',
                                transformOrigin: 'bottom'
                            }}></div>
                            <div className="absolute top-10 left-10 text-green-500 font-mono text-xl opacity-50 animate-pulse">01001011</div>
                            <div className="absolute top-40 right-20 text-green-500 font-mono text-xl opacity-50 animate-pulse" style={{animationDelay:'0.5s'}}>11010010</div>
                        </div>
                    );
                default: return <div className="absolute inset-0 bg-gray-200"></div>;
            }
        };

        // --- LEVEL INHALTE (27 LEVEL) - FOKUS: DEBUGGING ---

        // W1: Tal der Anleitungen (Grundlagen & Rezept-Bugs)
        const L1_1 = ({ onComplete }) => (
            <div className="animate-pop-in">
                <DialogBox title="Was ist ein Algorithmus?" icon="fa-scroll" color="green">
                    <p>Willkommen! Algo der Zettel freut sich auf die Bug-Jagd mit dir.</p>
                    <p>Ein <strong>Algorithmus</strong> ist eine <strong>Schritt-für-Schritt-Anleitung</strong>, um ein Problem zu lösen.</p>
                    <p>Wenn auch nur ein Schritt falsch ist, haben wir einen <strong>Bug (Fehler)</strong>! In dieser Welt lernst du, wie man kaputte Anleitungen erkennt und repariert (Debugging).</p>
                </DialogBox>
                <Button3D color="green" onClick={onComplete}>Ich werde Bug-Jäger! 🐛</Button3D>
            </div>
        );
        const L1_2 = ({ onComplete }) => {
            const [ans, setAns] = useState(0);
            return (
                <div className="animate-pop-in">
                    <DialogBox title="Der Rezept-Bug" icon="fa-bug" color="red">
                        <p>Ein Algorithmus muss logisch sein. Hier ist ein Code fürs Kuchenbacken. Wo hat sich der Logik-Fehler eingeschlichen?</p>
                        <div className="font-mono bg-white border-2 border-red-200 p-4 rounded-xl mt-4 mb-4 text-red-900 shadow-inner">
                            1. Teig in die Form füllen<br/>
                            2. Kuchen aus dem Ofen holen<br/>
                            3. Ofen anschalten
                        </div>
                        <div className="space-y-3">
                            <button onClick={()=>setAns(1)} className={`w-full p-3 rounded-xl border-4 font-bold text-left ${ans===1?'bg-red-200 border-red-500':'bg-white hover:bg-gray-50'}`}>A) Schritt 1 ist falsch, es fehlt Mehl.</button>
                            <button onClick={()=>setAns(2)} className={`w-full p-3 rounded-xl border-4 font-bold text-left ${ans===2?'bg-green-200 border-green-500':'bg-white hover:bg-gray-50'}`}>B) Schritt 2 & 3 sind falsch herum. Man holt keinen ungebackenen Kuchen raus!</button>
                        </div>
                    </DialogBox>
                    {ans === 2 && <Button3D color="green" onClick={onComplete}>Exakt! Gut repariert! 🎉</Button3D>}
                    {ans === 1 && <p className="text-center font-bold text-red-500">Es fehlt zwar Mehl, aber der Haupt-Fehler ist die Logik am Ende!</p>}
                </div>
            );
        };
        const L1_3 = ({ onComplete }) => {
            const [order, setOrder] = useState([]);
            // Die durcheinander gewürfelten Schritte
            const steps = ["🔥 Gerät einschalten", "🧈 Butter schmieren", "🍞 Toast reinlegen"];
            const correctOrder = ["🍞 Toast reinlegen", "🔥 Gerät einschalten", "🧈 Butter schmieren"];
            
            const handleClick = (step) => { if(order.length < 3 && !order.includes(step)) setOrder([...order, step]); };
            const correct = order.join() === correctOrder.join();

            return (
                <div className="text-center animate-pop-in">
                    <i className="fa-solid fa-bread-slice text-7xl text-yellow-600 mb-4 animate-float block"></i>
                    <h2 className="text-3xl font-black mb-4">Boss: Der verbuggte Toaster</h2>
                    <p className="bg-yellow-100 p-4 rounded-2xl border-4 border-yellow-300 font-bold mb-6 text-sm text-left">
                        "Hilfe! Mein Code ist komplett durcheinander geraten. Bringe die Schritte in die richtige Reihenfolge, um den Toast-Algorithmus zu ent-buggen!"
                    </p>
                    
                    <div className="flex justify-center gap-2 mb-4">
                        {steps.map((s,i) => (
                            <button key={i} onClick={()=>handleClick(s)} disabled={order.includes(s)} className={`p-2 border-2 rounded-lg text-sm font-bold ${order.includes(s)?'bg-gray-200 text-gray-400':'bg-white hover:bg-blue-50 border-blue-400 shadow-sm'}`}>{s}</button>
                        ))}
                    </div>

                    <div className="bg-white p-4 min-h-[150px] border-4 border-gray-400 rounded-xl mb-6 text-left shadow-inner">
                        <p className="text-gray-400 font-bold mb-2">Neuer, reparierter Code:</p>
                        <ol className="list-decimal list-inside font-bold text-green-700 space-y-2">
                            {order.map((s,i)=><li key={i}>{s}</li>)}
                        </ol>
                        {order.length > 0 && order.length < 3 && <button onClick={()=>setOrder([])} className="text-red-500 text-sm mt-2 font-bold underline"><i className="fa-solid fa-trash"></i> Löschen</button>}
                    </div>

                    {order.length === 3 && correct && <Button3D color="purple" onClick={onComplete}>Perfekter Toast! Bug behoben! 🏰</Button3D>}
                    {order.length === 3 && !correct && (
                        <div className="animate-pop-in">
                            <p className="text-red-500 font-bold mb-2"><i className="fa-solid fa-bug"></i> Immer noch ein Fehler!</p>
                            <Button3D color="red" onClick={()=>setOrder([])}>Code neu schreiben</Button3D>
                        </div>
                    )}
                </div>
            );
        };

        // W2: Wüste der Verwirrung (Eindeutigkeit & Ambiguity Bugs)
        const L2_1 = ({ onComplete }) => (
            <div className="animate-pop-in">
                <DialogBox title="Die Eindeutigkeits-Regel" icon="fa-robot" color="orange">
                    <p>Roboter und Computer haben <b>keine Fantasie</b>.</p>
                    <p>Ein Befehl wie "Mach mal das Fenster auf" ist ein schwerer Bug für einen Roboter. Welches Fenster? Das im Bad? Das Wohnzimmerfenster? Wie weit auf?</p>
                    <p>Jede Zeile Code muss <strong>absolut eindeutig</strong> sein!</p>
                </DialogBox>
                <Button3D color="orange" onClick={onComplete}>Code darf nicht schwammig sein!</Button3D>
            </div>
        );
        const L2_2 = ({ onComplete }) => {
            const [ans, setAns] = useState(0);
            return (
                <div className="animate-pop-in">
                    <DialogBox title="Such den ungenauen Befehl" icon="fa-bug" color="red">
                        <p>Ein Roboter soll dir einen Apfel holen. Welcher Code führt zu einem "Verwirrungs-Bug"?</p>
                        <div className="space-y-3 mt-4">
                            <button onClick={()=>setAns(1)} className={`w-full p-4 rounded-xl border-4 font-mono font-bold text-left ${ans===1?'bg-red-200 border-red-500':'bg-white hover:bg-gray-50'}`}>A) GEHE_ZU(Küche); NIMM(Apfel_rot);</button>
                            <button onClick={()=>setAns(2)} className={`w-full p-4 rounded-xl border-4 font-mono font-bold text-left ${ans===2?'bg-green-200 border-green-500':'bg-white hover:bg-gray-50'}`}>B) GEHE_MAL(Irgendwo_hin); NIMM(Obst);</button>
                        </div>
                    </DialogBox>
                    {ans === 2 && <Button3D color="green" onClick={onComplete}>Richtig! "Irgendwo" und "Obst" sind Fehler! 🎉</Button3D>}
                    {ans === 1 && <p className="text-center font-bold text-red-500">Das ist ein perfekter, fehlerfreier Code!</p>}
                </div>
            );
        };
        const L2_3 = ({ onComplete }) => {
            const [commands, setCommands] = useState(['V', 'V', 'V']); // Verbuggter Startcode
            const [carState, setCarState] = useState({ x: 0, y: 2, rot: -90 });
            const [status, setStatus] = useState('idle'); // idle, running, crashed, failed, won

            const target = { x: 1, y: 1 };

            const reset = () => {
                setCarState({ x: 0, y: 2, rot: -90 });
                setCommands(['V', 'V', 'V']); // Reset to buggy code
                setStatus('idle');
            };

            const addCmd = (cmd) => {
                if (status === 'idle' && commands.length < 6) setCommands([...commands, cmd]);
            };

            const delCmd = () => {
                if (status === 'idle' && commands.length > 0) setCommands(commands.slice(0, -1));
            };

            const run = async () => {
                if (status !== 'idle' || commands.length === 0) return;
                setStatus('running');

                let cx = 0; let cy = 2; let crot = -90;
                setCarState({ x: cx, y: cy, rot: crot });
                await new Promise(r => setTimeout(r, 300));

                for (let i = 0; i < commands.length; i++) {
                    const cmd = commands[i];
                    if (cmd === 'V') {
                        let nrot = ((crot % 360) + 360) % 360;
                        if (nrot === 0) cx += 1;
                        else if (nrot === 90) cy += 1;
                        else if (nrot === 180) cx -= 1;
                        else if (nrot === 270) cy -= 1;
                    } else if (cmd === 'R') {
                        crot += 90;
                    } else if (cmd === 'L') {
                        crot -= 90;
                    }

                    setCarState({ x: cx, y: cy, rot: crot });
                    await new Promise(r => setTimeout(r, 600));

                    // Check Crash
                    if (cx < 0 || cx > 2 || cy < 0 || cy > 2) {
                        setStatus('crashed');
                        return;
                    }
                }

                if (cx === target.x && cy === target.y) {
                    setStatus('won');
                } else {
                    setStatus('failed');
                }
            };

            return (
                <div className="text-center animate-pop-in">
                    <h2 className="text-3xl font-black mb-4">Boss: Crash-Test-Auto</h2>
                    <p className="bg-red-100 p-3 rounded-2xl border-4 border-red-300 font-bold mb-4 text-sm text-left text-red-900">
                        <i className="fa-solid fa-triangle-exclamation"></i> BUG GEFUNDEN: Der aktuelle Code "Vor, Vor, Vor" lässt das Auto in die Wand krachen! <br/>Lösche den kaputten Code und baue einen neuen bis zur roten Flagge!
                    </p>
                    
                    {/* Interactive Grid */}
                    <div className="relative mx-auto mb-6 bg-gray-200 border-4 border-gray-400 rounded-xl shadow-inner box-content overflow-hidden" style={{ width: '180px', height: '180px' }}>
                        <div className="absolute inset-0 grid grid-cols-3 grid-rows-3 pointer-events-none">
                            {[0,1,2,3,4,5,6,7,8].map(i => <div key={i} className="border border-gray-300"></div>)}
                        </div>
                        
                        <div className="absolute flex items-center justify-center text-red-500 text-3xl" style={{ left: `${target.x * 60}px`, top: `${target.y * 60}px`, width: '60px', height: '60px' }}>
                            <i className="fa-solid fa-flag animate-bounce"></i>
                        </div>

                        <div 
                            className="absolute flex items-center justify-center transition-all duration-500 ease-in-out z-10"
                            style={{ 
                                left: `${carState.x * 60}px`, 
                                top: `${carState.y * 60}px`,
                                width: '60px', height: '60px',
                                transform: `rotate(${carState.rot}deg)`
                            }}
                        >
                            <i className={`fa-solid ${status === 'crashed' ? 'fa-explosion text-red-600 scale-150' : 'fa-car-side text-orange-600'} text-4xl drop-shadow-md transition-all`}></i>
                        </div>
                    </div>

                    {/* Program Code view */}
                    <div className={`bg-white border-4 rounded-xl p-2 mb-4 min-h-[56px] flex items-center justify-center gap-2 flex-wrap shadow-inner ${commands.join('') === 'VVV' ? 'border-red-400 bg-red-50' : 'border-gray-300'}`}>
                        {commands.length === 0 && <span className="text-gray-400 text-sm font-bold">Code ist leer.</span>}
                        {commands.map((c, i) => (
                            <span key={i} className="bg-orange-200 border-2 border-orange-400 text-orange-900 font-bold px-3 py-1 rounded-lg shadow-sm">
                                {c === 'V' ? 'Vor' : c === 'R' ? 'Rechts' : 'Links'}
                            </span>
                        ))}
                    </div>

                    {/* Controls */}
                    {status === 'idle' && (
                        <div className="space-y-3">
                            <div className="flex justify-center gap-2">
                                <button onClick={()=>addCmd('L')} className="bg-blue-100 hover:bg-blue-200 border-2 border-blue-400 text-blue-800 font-black px-4 py-2 rounded-xl shadow-sm"><i className="fa-solid fa-arrow-rotate-left"></i> L</button>

                                {cheatError && <p className="text-red-500 font-bold mb-4">Falsches Passwort!</p>}
                                <div className="flex gap-4">
                                    <button onClick={() => {setShowCheatModal(false); setCheatError(false); setCheatPw('');}} className="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-3 rounded-xl transition-colors">Abbrechen</button>
                                    <button onClick={handleCheatSubmit} className="flex-1 bg-yellow-400 hover:bg-yellow-500 text-yellow-900 font-bold py-3 rounded-xl border-b-4 border-yellow-600 active:border-b-0 active:translate-y-1 transition-all">Freischalten</button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Versteckter Sonnen-Button oben rechts */}
                    <button 
                        onClick={() => setShowCheatModal(true)} 
                        className="absolute top-4 right-4 text-yellow-400 opacity-30 hover:opacity-100 hover:rotate-180 transition-all duration-500 z-50 text-4xl cursor-pointer"
                    >
                        <i className="fa-solid fa-sun"></i>
                    </button>

                    {/* Wolken Deko */}
                    <div className="absolute top-10 left-10 text-white/50 text-8xl animate-float" style={{animationDelay: '0s'}}><i className="fa-solid fa-cloud"></i></div>
                    <div className="absolute top-40 right-20 text-white/50 text-9xl animate-float" style={{animationDelay: '1s'}}><i className="fa-solid fa-cloud"></i></div>

                    <div className="max-w-6xl mx-auto p-4 md:p-8 relative z-10 animate-fade-in-up">
                        <div className="bg-white/90 p-6 rounded-[2rem] shadow-xl border-b-8 border-white mb-12 text-center inline-block mx-auto transform -rotate-2">
                            <h1 className="text-5xl md:text-7xl font-black text-blue-600 tracking-tighter drop-shadow-md">Super Algo World <span className="text-green-500">3D</span></h1>
                        </div>

                        {/* 3x3 Grid für genau 9 Welten */}
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-5xl mx-auto">
                            {WORLDS.map((w, i) => {
                                const wUnlocked = isUnlocked(`${w.id}-1`);
                                const [maxW, maxL] = maxUnlocked.split('-').map(Number);
                                const isAlgoHereOnMap = w.id === maxW;
                                const isNeon = w.id === 9;
                                
                                return (
                                    <button 
                                        key={w.id} 
                                        disabled={!wUnlocked}
                                        onClick={() => { setActiveWorldId(w.id); setView('world'); }}
                                        className={`island-3d relative flex flex-col items-center p-6 rounded-[2.5rem] bg-gradient-to-b ${wUnlocked ? w.gradient : 'from-gray-400 to-gray-600'} ${isNeon && wUnlocked ? 'border-cyan-600 shadow-[0_0_20px_rgba(0,255,255,0.4)]' : ''} text-white border-4 ${wUnlocked && !isNeon ? 'border-white/50' : (!wUnlocked ? 'border-gray-500' : '')} ${wUnlocked ? 'cursor-pointer hover:brightness-110' : 'cursor-not-allowed opacity-80'} `}
                                        style={{ animationDelay: `${i * 100}ms` }}
                                    >
                                        <div className={`w-20 h-20 rounded-full flex items-center justify-center text-4xl shadow-inner mb-4 backdrop-blur-sm ${isNeon ? 'bg-black border-2 border-cyan-500 neon-blue-text' : 'bg-white/20'}`}>
                                            {wUnlocked ? <i className={`fa-solid ${w.icon}`}></i> : <i className="fa-solid fa-lock text-gray-300"></i>}
                                        </div>
                                        <h2 className={`font-black text-2xl mb-2 drop-shadow-md text-center ${isNeon ? 'neon-blue-text font-mono' : ''}`}>{w.title}</h2>
                                        <div className={`px-4 py-1 rounded-full font-bold text-sm ${isNeon ? 'bg-cyan-900/50 neon-blue-text border border-cyan-600' : 'bg-black/20'}`}>Welt {w.id}</div>
                                        
                                        {/* Algo auf der Weltkarte */}
                                        {wUnlocked && isAlgoHereOnMap && (
                                            <div className="absolute -top-12 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none">
                                                <AlgoCharacter />
                                            </div>
                                        )}

                                        {/* Neue Welt Indikator */}
                                        {wUnlocked && maxUnlocked.startsWith(`${w.id}-`) && (
                                            <div className={`absolute -top-4 -right-4 text-white font-black px-4 py-2 rounded-full shadow-lg animate-bounce border-2 ${isNeon ? 'bg-black border-cyan-500 text-cyan-500' : 'bg-red-500 border-white'}`}>
                                                HIER!
                                            </div>
                                        )}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
