                        </div>
                    </div>
                </DialogBox>
                <ReadTimerButton color="purple" onClick={onComplete}>Kästen stapeln!</ReadTimerButton>
            </div>
        );

        const L6_3 = ({ onComplete, logError }) => (
            <MCLevel 
                title="Der erste Blick" icon="fa-eye" color="green"
                text="Woran erkennst du ein Struktogramm sofort (im Vergleich zum Flussdiagramm)?"
                options={[
                    { text: "Es hat keine Pfeile!", correct: true },
                    { text: "Es ist immer rot markiert.", correct: false, msg: "Die Farbe spielt keine Rolle." },
                    { text: "Es nutzt Ovale für Start und Ende.", correct: false, msg: "Das macht das Flussdiagramm!" },
                    { text: "Es ist nur für Computer lesbar.", correct: false, msg: "Diagramme sind immer für Menschen!" }
                ]}
                onComplete={onComplete}
                logError={logError}
            />
        );

        const L6_4 = ({ onComplete, logError }) => {
            const dragTasks = [
                {
                    title: "Flussdiagramm: Sequenz",
                    layout: "flow-3",
                    blocks: [{id: 1, text: 'START'}, {id: 2, text: 'Aktion'}, {id: 3, text: 'ENDE'}],
                    solution: [1, 2, 3]
                },
                {
                    title: "Struktogramm: Sequenz",
                    layout: "struct-3",
                    blocks: [{id: 1, text: 'Schritt 1'}, {id: 2, text: 'Schritt 2'}, {id: 3, text: 'Schritt 3'}],
                    solution: [1, 2, 3]
                },
                {
                    title: "Flussdiagramm: Verzweigung",
                    layout: "flow-branch",
                    blocks: [{id: 1, text: 'Frage?'}, {id: 2, text: 'JA-Aktion'}, {id: 3, text: 'NEIN-Aktion'}],
                    solution: [1, 2, 3]
                },
                {
                    title: "Struktogramm: WENN-DANN",
                    layout: "struct-if",
                    blocks: [{id: 1, text: 'Bedingung?'}, {id: 2, text: 'JA-Aktion'}, {id: 3, text: 'NEIN-Aktion'}],
                    solution: [1, 2, 3]
                },
                {
                    title: "Flussdiagramm: Umweg",
                    layout: "flow-4",
                    blocks: [{id: 1, text: 'START'}, {id: 2, text: 'ENDE'}, {id: 3, text: 'Drehe links'}, {id: 4, text: 'Gehe vor'}],
                    solution: [1, 3, 4, 2]
                },
                {
                    title: "Struktogramm: Schleife",
                    layout: "struct-loop",
                    blocks: [{id: 1, text: 'SOLANGE Hunger da ist:'}, {id: 2, text: 'Pausenbrot essen'}],
                    solution: [1, 2]
                }
            ];

            return (
                <DnDBossGauntlet 
                    title="Darstellungs-Meister" icon="fa-puzzle-piece" 
                    colorClass="bg-red-100 border-red-300 text-red-900" textClass="text-red-600"
                    tasks={dragTasks}
                    onComplete={onComplete}
                    logError={logError}
                />
            );
        };

        // --- WELT DEFINITIONEN ---
        const WORLDS = [
            { id: 1, title: "Grundlagen", levels: [{n: "1-1", C: L1_1}, {n: "1-2", C: L1_2}, {n: "1-3", C: L1_3, boss: true}] },
            { id: 2, title: "Roboter-Mission", levels: [
                {n: "2-1", C: L2_1}, 
                {n: "2-2", C: L2_2}, 
                {n: "2-3", C: L2_3}, 
                {n: "2-4", C: L2_4}, 
                {n: "2-5", C: L2_5, boss: true}
            ] },
            { id: 3, title: "Regeln für Sequenzen", levels: [{n: "3-1", C: L3_1}, {n: "3-2", C: L3_2}, {n: "3-3", C: L3_3}, {n: "3-4", C: L3_4}, {n: "3-5", C: L3_5, boss: true}] },
            { id: 4, title: "Schleifen", levels: [{n: "4-1", C: L4_1}, {n: "4-2", C: L4_2}, {n: "4-3", C: L4_3, boss: true}] },
            { id: 5, title: "Bedingungen", levels: [{n: "5-1", C: L5_1}, {n: "5-2", C: L5_2}, {n: "5-3", C: L5_3, boss: true}] },
            { id: 6, title: "Diagramme", levels: [{n: "6-1", C: L6_1}, {n: "6-2", C: L6_2}, {n: "6-3", C: L6_3}, {n: "6-4", C: L6_4, boss: true}] },
            { id: 7, title: "Roboter-Arena", levels: [{n: "7-1", C: RoboArenaGame, boss: true}] },
        ];

        // --- HAUPT-APP ---
        const App = () => {
            const [studentName, setStudentName] = useState('');
            const [analytics, setAnalytics] = useState(() => {
                const saved = localStorage.getItem('algo_analytics');
                return saved ? JSON.parse(saved) : {};
            });
            const [view, setView] = useState('login'); 
            
            const [maxUnlocked, setMaxUnlocked] = useState('1-1');
            const [activeWorldId, setActiveWorldId] = useState(1);
            const [activeLevelId, setActiveLevelId] = useState(null);
            
            const [showCheatModal, setShowCheatModal] = useState(false);
            const [cheatPw, setCheatPw] = useState('');
            const [cheatError, setCheatError] = useState('');

            const logError = (levelId, errorDetail) => {
                if (!studentName) return;
                setAnalytics(prev => {
                    const newData = { ...prev };
                    if (!newData[studentName]) newData[studentName] = { total: 0, details: {} };
                    newData[studentName].total += 1;
                    
                    const levelKey = `Level ${levelId}`;
                    if (!newData[studentName].details[levelKey]) newData[studentName].details[levelKey] = {};
                    
                    if (!newData[studentName].details[levelKey][errorDetail]) {
                        newData[studentName].details[levelKey][errorDetail] = 0;
                    }
                    newData[studentName].details[levelKey][errorDetail] += 1;
                    
                    localStorage.setItem('algo_analytics', JSON.stringify(newData));
                    return newData;
                });
            };

            const isUnlocked = (lvlId) => {
                if (lvlId === '7-1') {
                    const [mw] = maxUnlocked === 'win' ? [7] : maxUnlocked.split('-').map(Number);
                    return mw >= 4;
                }
                if (maxUnlocked === 'win') return true;
                const [w1, l1] = lvlId.split('-').map(Number);
                const [w2, l2] = maxUnlocked.split('-').map(Number);
                if (w1 < w2) return true;
                if (w1 === w2 && l1 <= l2) return true;
                return false;
            };

            const isCompleted = (lvlId) => {
                if (lvlId === '7-1') return false; 
                if (maxUnlocked === 'win') return true;
                const [w1, l1] = lvlId.split('-').map(Number);
                const [w2, l2] = maxUnlocked.split('-').map(Number);
                if (w1 < w2) return true;
                if (w1 === w2 && l1 < l2) return true;
                return false;
            };

            const getLevelIndex = (lvlId) => {
                const totalRegularLevels = WORLDS.filter(w => w.id !== 7).reduce((acc, w) => acc + w.levels.length, 0);
                if (lvlId === 'win') return totalRegularLevels;
                let index = 0;
                for (let w of WORLDS) {
                    if (w.id === 7) continue;
                    for (let l of w.levels) {
                        if (l.n === lvlId) return index;
                        index++;
                    }
                }
                return index;
            };

            const getNextLvl = (currId) => {
                if (currId === '6-4') return 'win';
                const [w, l] = currId.split('-').map(Number);
                const currentWorld = WORLDS.find(world => world.id === w);
                if (l < currentWorld.levels.length) {
                    return `${w}-${l+1}`;
                } else {
                    return `${w+1}-1`;
                }
            };

            const onLevelComplete = () => {
                if (activeLevelId === '7-1') {
                    setView('overview');
                    return;
                }
                const nextId = getNextLvl(activeLevelId);
                if (nextId === 'win') { 
                    setMaxUnlocked('win');
                    setView('win'); 
                } else {
                    const [nextW, nextL] = nextId.split('-').map(Number);
                    if (!isUnlocked(nextId)) setMaxUnlocked(nextId);
                    if (nextW > activeWorldId) { setView('overview'); } else { setView('world'); }
                }
            };

            const handleCheat = () => { 
                if(cheatPw === 'Sonnenschein') { 
                    setMaxUnlocked('7-1'); 
                    setShowCheatModal(false); 
                    setCheatPw(''); 
                    setCheatError('');
                } else if(cheatPw.toLowerCase() === 'lehrer') { 
                    setView('dashboard'); 
                    setShowCheatModal(false); 
                    setCheatPw(''); 
                    setCheatError('');
                } else {
                    setCheatError('Passwort inkorrekt!');
                }
            };

            const maxW = maxUnlocked === 'win' ? 7 : maxUnlocked.split('-').map(Number)[0];
            const maxL = maxUnlocked === 'win' ? 1 : maxUnlocked.split('-').map(Number)[1];
            
            const totalLevelsCompleted = getLevelIndex(maxUnlocked);
            const xp = totalLevelsCompleted * 10;
            const maxXP = WORLDS.filter(w => w.id !== 7).reduce((acc, w) => acc + w.levels.length, 0) * 10;

            if (view === 'login') {
                return (
                    <div className="min-h-screen bg-sky-300 flex items-center justify-center p-4 font-sans">
                        <div className="relative bg-white p-10 mt-16 rounded-3xl shadow-2xl text-center max-w-lg border-8 border-blue-500 animate-pop-in w-full">
                            <div className="absolute -top-24 left-1/2 transform -translate-x-1/2 scale-150 origin-bottom z-50">
                                <AlgoCharacter />
                            </div>
                            
                            <h1 className="text-3xl font-black text-gray-800 mb-4 mt-6">Wer spielt gerade?</h1>
                            <p className="text-gray-600 mb-6 font-bold">"Hallo! Ich bin Algo. Ich möchte gerne eure Namen kennenlernen. Bitte tragt euch ein!"</p>
                            <input 
                                type="text" 
                                value={studentName} 
                                onChange={e => setStudentName(e.target.value)}
                                placeholder="Eure Namen (z.B. Max & Anna)..."
                                className="w-full p-4 text-xl border-4 border-gray-300 rounded-xl mb-6 text-center focus:border-blue-500 outline-none"
                                onKeyDown={e => { if(e.key === 'Enter' && studentName.trim()) setView('overview') }}
                            />
                            <Button3D color="blue" disabled={!studentName.trim()} onClick={() => setView('overview')}>SPIEL STARTEN</Button3D>
                        </div>
                    </div>
                );
            }

            if (view === 'dashboard') {
                return (
                    <div className="min-h-screen bg-gray-900 p-8 font-sans text-white">
                        <div className="max-w-6xl mx-auto animate-fade-in-up">
                            <div className="flex flex-col md:flex-row justify-between items-center mb-8 border-b-4 border-gray-700 pb-6 gap-4">
                                <h1 className="text-4xl font-black text-blue-400"><i className="fa-solid fa-chart-line mr-3"></i> Lehrer-Dashboard</h1>
                                <div className="flex gap-4">
                                    <button onClick={() => { if(confirm('Möchten Sie wirklich alle Tracking-Daten löschen?')) { localStorage.removeItem('algo_analytics'); setAnalytics({}); } }} className="bg-red-600 hover:bg-red-700 px-6 py-3 rounded-xl font-bold text-sm transition-colors"><i className="fa-solid fa-trash mr-2"></i> Daten löschen</button>
                                    <button onClick={() => setView('overview')} className="bg-gray-700 hover:bg-gray-600 px-6 py-3 rounded-xl font-bold text-sm transition-colors"><i className="fa-solid fa-arrow-left mr-2"></i> Zurück zur Karte</button>
                                </div>
                            </div>
                            
                            {Object.keys(analytics).length === 0 ? (
                                <div className="bg-gray-800 p-12 rounded-3xl text-center text-gray-400 font-bold text-xl border-4 border-gray-700 border-dashed">
                                    <i className="fa-solid fa-ghost text-5xl mb-4 opacity-50 block"></i>
                                    Es wurden noch keine Fehler aufgezeichnet.
                                </div>
                            ) : (
                                <div className="grid gap-6 md:grid-cols-2 lg:grid-cols-3">
                                    {Object.entries(analytics).map(([name, data]) => (
                                        <div key={name} className="bg-gray-800 p-6 rounded-2xl border-t-8 border-blue-500 shadow-xl flex flex-col">
                                            <div className="flex justify-between items-start mb-6 border-b-2 border-gray-700 pb-4">
                                                <h2 className="text-2xl font-black text-white break-words flex-1 pr-4">{name}</h2>
                                                <span className="bg-red-500/20 text-red-400 px-3 py-1 rounded-full font-bold border border-red-500/50 whitespace-nowrap">{data.total} Fehler</span>
                                            </div>
                                            <div className="space-y-4 flex-1 overflow-y-auto pr-2 custom-scrollbar">
                                                {Object.entries(data.details).map(([level, errors]) => (
                                                    <div key={level} className="bg-gray-900 p-4 rounded-xl border border-gray-700">
                                                        <h3 className="font-bold text-blue-300 mb-3 text-sm tracking-wider uppercase">{level}</h3>
                                                        <ul className="space-y-2 text-sm">
                                                            {Object.entries(errors).map(([errDetail, count]) => (
                                                                <li key={errDetail} className="flex justify-between items-center text-gray-300 bg-gray-800 p-3 rounded-lg border-l-4 border-red-500">
                                                                    <span className="pr-4 leading-tight">{errDetail}</span>
                                                                    <span className="font-black text-red-400 bg-red-900/50 px-2 py-1 rounded">{count}x</span>
                                                                </li>
                                                            ))}
                                                        </ul>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    ))}
                                </div>
                            )}
                        </div>
                    </div>
                );
            }

            if (view === 'win') {
                return (
                    <div className="min-h-screen bg-black flex items-center justify-center p-4">
                        <div className="bg-gray-900 p-12 rounded-[3rem] text-center max-w-2xl border-8 border-cyan-500 shadow-[0_0_50px_rgba(0,255,255,0.4)] animate-pop-in">
                            <i className="fa-solid fa-user-astronaut text-9xl mb-8 animate-float block neon-text"></i>
                            <h1 className="text-5xl font-black mb-6 neon-text font-mono glitch-text">ALGO-MEISTER!</h1>
                            <p className="text-xl text-cyan-300 mb-8 font-mono">Du hast alle Level gemeistert. Falls noch nicht geschehen, teste jetzt die Roboter-Arena!</p>
                            <Button3D color="black" onClick={() => { setMaxUnlocked('1-1'); setActiveWorldId(1); setView('overview'); }}>NEUSTART</Button3D>
                        </div>
                    </div>
                );
            }

            if (view === 'level') {
                let LvlComp = null;
                WORLDS.forEach(w => w.levels.forEach(l => { if(l.n === activeLevelId) LvlComp = l.C; }));
                const isArena = activeWorldId === 7;
                return (
                    <div className={`min-h-screen ${isArena ? 'bg-black' : 'bg-screenshot-dark'} flex items-center justify-center p-4 md:p-8`}>
                        <div className={`w-full max-w-4xl bg-white rounded-[2rem] overflow-hidden animate-pop-in ${isArena ? 'border-8 border-cyan-600 shadow-[0_0_30px_#00ffff]' : ''}`}>
                            <div className={`p-4 flex justify-between items-center border-b-2 ${isArena ? 'bg-gray-900 border-cyan-500' : 'bg-gray-100 border-gray-200'}`}>
                                <button onClick={()=>setView('world')} className={`${isArena ? 'text-cyan-400 hover:text-white' : 'text-gray-600 hover:text-black'} font-bold flex items-center gap-2`}><i className="fa-solid fa-arrow-left"></i> Zurück zur Karte</button>
                                <h2 className={`font-black text-xl ${isArena ? 'text-cyan-400 font-mono glitch-text' : 'text-gray-800'}`}>LEVEL {activeLevelId}</h2>
                                <div className="w-32"></div>
                            </div>
                            <div className={`p-8 md:p-12 ${isArena ? 'bg-black' : ''}`}>{LvlComp && <LvlComp onComplete={onLevelComplete} logError={(detail) => logError(activeLevelId, detail)} />}</div>
                        </div>
                    </div>
                );
            }

            if (view === 'overview') {
                return (
                    <div className="min-h-screen bg-sky-300 pb-20 relative overflow-hidden">
                        {showCheatModal && (
                            <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[100] animate-pop-in p-4">
                                <div className="bg-white p-8 rounded-3xl max-w-sm w-full text-center shadow-[0_0_50px_rgba(255,255,0,0.5)]">
                                    <i className="fa-solid fa-sun text-6xl text-yellow-400 mb-4 animate-[spin_10s_linear_infinite]"></i>
                                    <h2 className="text-2xl font-black mb-4 text-yellow-600">Geheim-Menü</h2>
                                    <input type="password" value={cheatPw} onChange={(e) => setCheatPw(e.target.value)} placeholder="Passwort..." className="w-full p-4 text-xl border-4 border-yellow-300 rounded-xl mb-4 text-center outline-none focus:border-yellow-500" />
                                    {cheatError && <p className="text-red-500 font-bold mb-4">{cheatError}</p>}
                                    <div className="flex gap-4">
                                        <button onClick={() => {setShowCheatModal(false); setCheatPw(''); setCheatError('');}} className="flex-1 bg-gray-200 font-bold py-3 rounded-xl">Abbrechen</button>
                                        <button onClick={handleCheat} className="flex-1 bg-yellow-400 font-bold py-3 rounded-xl">Bestätigen</button>
                                    </div>
                                </div>
                            </div>
                        )}
                        <button onClick={() => setShowCheatModal(true)} className="absolute top-4 right-4 text-yellow-400 opacity-30 hover:opacity-100 hover:rotate-180 transition-all duration-500 z-50 text-4xl cursor-pointer"><i className="fa-solid fa-sun"></i></button>
                        <div className="absolute top-10 left-10 text-white/50 text-8xl animate-float" style={{animationDelay: '0s'}}><i className="fa-solid fa-cloud"></i></div>
                        <div className="absolute top-40 right-20 text-white/50 text-9xl animate-float" style={{animationDelay: '1s'}}><i className="fa-solid fa-cloud"></i></div>

                        <div className="max-w-6xl mx-auto p-4 md:p-8 relative z-10 animate-fade-in-up">
                            <div className="bg-white/90 p-6 rounded-[2rem] shadow-xl border-b-8 border-white mb-12 text-center inline-block mx-auto transform -rotate-2">
                                <h1 className="text-5xl md:text-7xl font-black text-blue-600 tracking-tighter drop-shadow-md">Super Algo World <span className="text-green-500">3D</span></h1>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-5xl mx-auto">
                                {WORLDS.map((w, i) => {
                                    const isArena = w.id === 7;
                                    const wUnlocked = isArena ? (maxW >= 4) : isUnlocked(`${w.id}-1`);
                                    
                                    return (
                                        <button 
                                            key={w.id} disabled={!wUnlocked} onClick={() => { setActiveWorldId(w.id); setView('world'); }}
                                            className={`island-3d relative flex flex-col items-center p-6 rounded-[2.5rem] bg-gradient-to-b ${wUnlocked ? (isArena ? 'from-gray-800 to-black' : 'from-blue-400 to-blue-600') : 'from-gray-400 to-gray-600'} ${isArena && wUnlocked ? 'shadow-[0_0_20px_rgba(0,255,255,0.4)] border-cyan-500' : ''} text-white border-4 ${wUnlocked && !isArena ? 'border-white/50' : (!wUnlocked ? 'border-gray-500' : '')} ${wUnlocked ? 'cursor-pointer hover:brightness-110' : 'cursor-not-allowed opacity-80'} `}
                                            style={{ animationDelay: `${i * 100}ms` }}
                                        >
                                            <div className={`w-20 h-20 rounded-full flex items-center justify-center text-4xl shadow-inner mb-4 backdrop-blur-sm ${isArena ? 'bg-gray-900 border-2 border-cyan-500 text-cyan-400' : 'bg-white/20'}`}>
                                                {wUnlocked ? (isArena ? <i className="fa-solid fa-gamepad"></i> : <span className="font-black">{w.id}</span>) : <i className="fa-solid fa-lock text-gray-300"></i>}
                                            </div>
                                            <h2 className={`font-black text-2xl mb-2 drop-shadow-md text-center ${isArena ? 'neon-text font-mono glitch-text' : ''}`}>{w.title}</h2>
                                            
                                            {/* Algo auf der Karte anzeigen */}
                                            {wUnlocked && activeWorldId === w.id && !isArena && (
                                                <div className="absolute -top-12 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none">
                                                    <AlgoCharacter />
                                                </div>
                                            )}

                                            {wUnlocked && maxUnlocked.startsWith(`${w.id}-`) && !isArena && (
                                                <div className={`absolute -top-4 -right-4 text-white font-black px-4 py-2 rounded-full shadow-lg animate-bounce border-2 bg-red-500 border-white`}>
                                                    HIER!
                                                </div>
                                            )}

                                            {isArena && wUnlocked && (
                                                <div className="absolute -top-4 -right-4 text-white font-black px-4 py-1 rounded-full shadow-lg animate-pulse border-2 bg-black border-cyan-500 text-cyan-400 text-xs">
                                                    ZUSATZ-SPIEL
                                                </div>
                                            )}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            }

            const W = WORLDS.find(w => w.id === activeWorldId);
            const isArena = W.id === 7;
            let worldProgress = 0;
            if (maxW > W.id) worldProgress = 100;
            else if (maxW === W.id) worldProgress = Math.round(((maxL - 1) / W.levels.length) * 100);

            const currentNodes = W.levels.length === 5 ? [
                { left: '15%', top: '80%' }, { left: '35%', top: '65%' }, { left: '55%', top: '50%' }, { left: '75%', top: '35%' }, { left: '85%', top: '15%' }
            ] : W.levels.length === 4 ? [
                { left: '15%', top: '75%' }, { left: '40%', top: '55%' }, { left: '65%', top: '35%' }, { left: '85%', top: '15%' }
            ] : W.levels.length === 3 ? [
                { left: '20%', top: '75%' }, { left: '50%', top: '50%' }, { left: '75%', top: '25%' }
            ] : [
                { left: '50%', top: '50%' }
            ];

            return (
                <div className={`min-h-screen ${isArena ? 'bg-black' : 'bg-screenshot-dark'} flex flex-col font-sans`}>
                    <div className={`${isArena ? 'bg-gray-900 border-b border-cyan-600' : 'bg-white'} h-20 w-full flex items-center justify-between px-4 md:px-6 shadow-md z-50`}>
                        <div className="flex items-center gap-4">
                            <button onClick={()=>setView('overview')} className={`${isArena ? 'bg-gray-800 text-cyan-500 border border-cyan-700' : 'bg-gray-200 hover:bg-gray-300 text-gray-700'} w-12 h-12 rounded-xl flex items-center justify-center font-black text-xl shadow-sm transition-colors`}><i className="fa-solid fa-list"></i></button>
                            <h1 className={`${isArena ? 'neon-text font-mono' : 'text-screenshot-dark'} font-black text-xl md:text-2xl tracking-wide hidden md:block`}>{W.title}</h1>
                        </div>
                        {!isArena && (
                            <div className="flex items-center gap-4">
                                <div className="text-right"><div className="font-black text-screenshot-dark text-sm leading-tight">LEVEL {maxW > 6 ? 6 : maxW}</div><div className="text-xs text-gray-500 font-bold">{xp} / {maxXP} XP</div></div>
                                <div className="w-24 md:w-40 h-6 bg-screenshot-panel rounded-full overflow-hidden border border-gray-300"><div className="h-full bg-blue-500" style={{ width: `${(xp/maxXP)*100}%` }}></div></div>
                            </div>
                        )}
                    </div>

                    <div className="flex-1 flex items-center justify-center p-4 md:p-6 relative">
                        <div className={`${isArena ? 'bg-gray-900 border-cyan-600 shadow-[0_0_30px_#00ffff]' : 'bg-screenshot-sky border-screenshot-panel shadow-2xl'} w-full max-w-4xl aspect-square md:aspect-video rounded-[2.5rem] relative overflow-hidden border-4`}>
                            {!isArena && (
                                <>
                                    <div className="absolute top-20 left-[15%] w-32 h-12 bg-white/80 rounded-full blur-[2px]"></div>
                                    <div className="absolute top-[40%] right-[10%] w-24 h-10 bg-white/80 rounded-full blur-[2px]"></div>
                                    <div className="absolute bottom-20 right-[25%] w-32 h-12 bg-white/80 rounded-full blur-[2px]"></div>
                                    <div className="absolute -bottom-32 -left-10 w-[120%] h-64 bg-screenshot-hill-light rounded-[100%]"></div>
                                    <div className="absolute -bottom-20 -right-20 w-96 h-64 bg-screenshot-hill-dark rounded-[100%]"></div>
                                    <div className="absolute -bottom-10 left-10 w-64 h-40 bg-screenshot-hill-dark rounded-[100%]"></div>
                                </>
                            )}
                            {isArena && <div className="absolute inset-0 opacity-30 pointer-events-none" style={{ backgroundImage: 'linear-gradient(rgba(0, 255, 255, 0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 255, 0.2) 1px, transparent 1px)', backgroundSize: '40px 40px', transform: 'perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px)', transformOrigin: 'bottom' }}></div>}

                            <div className="absolute top-4 left-4 z-30 flex flex-col gap-2 items-start">
                                <div className={`${isArena ? 'bg-black text-cyan-400 border-cyan-600 shadow-[0_0_10px_#00ffff]' : 'bg-screenshot-panel text-white border-gray-600'} font-black px-4 py-2 rounded-lg shadow-md uppercase tracking-widest text-xs md:text-sm border`}>WELT {W.id}: {W.title}</div>
                                <div className={`${isArena ? 'bg-black text-cyan-400 border-cyan-600' : 'bg-white text-screenshot-dark border-gray-300'} font-black px-3 py-2 md:px-4 md:py-3 rounded-xl shadow-md w-40 md:w-48 border`}>
                                    <div className="flex justify-between text-[10px] md:text-xs mb-2"><span>FORTSCHRITT</span><span>{worldProgress}%</span></div>
                                    <div className={`w-full h-3 rounded-full overflow-hidden p-[1px] ${isArena ? 'bg-gray-900 border border-cyan-800' : 'bg-white border-2 border-gray-400'}`}><div className={`h-full rounded-full ${isArena ? 'bg-cyan-500 shadow-[0_0_5px_#00ffff]' : 'bg-gray-400'}`} style={{width: `${worldProgress}%`}}></div></div>
                                </div>
                            </div>

                            {W.id > 1 && <button onClick={()=>setActiveWorldId(w=>w-1)} className={`absolute left-2 md:left-4 top-1/2 -translate-y-1/2 w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center font-bold shadow-md z-40 transition-colors ${isArena ? 'bg-gray-800 text-cyan-500 hover:bg-black border border-cyan-500' : 'bg-white/80 hover:bg-white'}`}><i className="fa-solid fa-chevron-left"></i></button>}
                            {W.id < 7 && isUnlocked(`${W.id+1}-1`) && <button onClick={()=>setActiveWorldId(w=>w+1)} className={`absolute right-2 md:right-4 top-1/2 -translate-y-1/2 w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center font-bold shadow-md z-40 transition-colors ${isArena ? 'bg-gray-800 text-cyan-500 hover:bg-black border border-cyan-500' : 'bg-white/80 hover:bg-white'}`}><i className="fa-solid fa-chevron-right"></i></button>}

                            {!isArena && (
                                <svg className="absolute inset-0 w-full h-full pointer-events-none z-10">
                                    {W.levels.map((_, i) => {
                                        if (i === W.levels.length - 1) return null;
                                        return (
                                            <g key={`line-${i}`}>
                                                <line x1={currentNodes[i].left} y1={currentNodes[i].top} x2={currentNodes[i+1].left} y2={currentNodes[i+1].top} stroke="#eab308" strokeWidth="6" strokeDasharray="8 8" strokeLinecap="round" />
                                                <line x1={currentNodes[i].left} y1={currentNodes[i].top} x2={currentNodes[i+1].left} y2={currentNodes[i+1].top} stroke="#ca8a04" strokeWidth="6" strokeDasharray="8 8" transform="translate(0, 3)" className="opacity-60" />
                                            </g>
                                        );
                                    })}
                                </svg>
                            )}

                            {W.levels.map((l, idx) => {
                                const unl = isUnlocked(l.n);
                                const comp = isCompleted(l.n);
                                const curr = l.n === maxUnlocked && !isArena;
                                const isAlgoHere = !isArena && ((W.id === maxW && (idx + 1) === maxL) || (W.id < maxW && idx === W.levels.length - 1));
                                const pos = isArena ? { left: '50%', top: '50%' } : currentNodes[idx];

                                return (
                                    <div key={l.n} className="absolute z-20 transform -translate-x-1/2 -translate-y-1/2" style={pos}>
                                        {idx === 0 && !isArena && <div className="absolute -bottom-8 -left-8 bg-red-600 text-white font-black text-xs px-2 py-1 transform -rotate-12 border-2 border-white rounded shadow-md z-30 pointer-events-none">START</div>}
                                        {isAlgoHere && <div className="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-1 z-50 pointer-events-none"><AlgoCharacter /></div>}
                                        <button 
                                            disabled={!unl} onClick={() => { setActiveLevelId(l.n); setView('level'); }}
                                            className={`relative flex items-center justify-center transition-transform hover:scale-110 shadow-lg 
                                                ${l.boss ? (isArena ? 'w-32 h-32 rounded-3xl bg-black border-[4px] border-cyan-500 shadow-[0_0_20px_#00ffff]' : 'w-20 h-20 rounded-2xl bg-screenshot-panel border-[3px] border-gray-600') : 'w-14 h-14 rounded-full bg-white/50 border-[5px] border-gray-300'}
                                                ${curr && !l.boss ? 'ring-[6px] ring-yellow-400 bg-white border-yellow-500' : ''}
                                                ${comp && !l.boss ? 'bg-gray-200 border-gray-400' : ''}`}
                                        >
                                            {curr && !l.boss && <div className="w-10 h-10 bg-yellow-400 rounded-full flex items-center justify-center text-screenshot-dark pl-1"><i className="fa-solid fa-play"></i></div>}
                                            {!curr && !comp && !l.boss && <i className="fa-solid fa-lock text-gray-400 text-lg"></i>}
                                            {comp && !l.boss && <i className="fa-solid fa-check text-gray-500 text-lg"></i>}
                                            
                                            {l.boss && (
                                                <div className="flex flex-col items-center justify-center opacity-80">
                                                    <i className={`fa-solid ${isArena ? 'fa-robot text-cyan-400 text-5xl drop-shadow-[0_0_8px_#00ffff]' : 'fa-brands fa-fort-awesome text-3xl text-gray-400'}`}></i>
                                                    {!unl && !isArena && <i className="fa-solid fa-lock absolute -top-3 -right-3 text-gray-400 bg-screenshot-panel rounded-full p-1 border border-gray-600 text-xs"></i>}
                                                </div>
                                            )}
                                        </button>
                                        <div className={`absolute -bottom-8 left-1/2 transform -translate-x-1/2 whitespace-nowrap text-xs font-bold px-3 py-1 rounded-full pointer-events-none ${isArena ? 'bg-black text-cyan-400 border border-cyan-600' : 'bg-gray-900/80 text-white'}`}>
                                            {isArena ? 'ARENA STARTEN' : (l.boss ? 'Boss-Burg' : `Level ${idx + 1}`)}
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
