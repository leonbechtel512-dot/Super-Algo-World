<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Algo World 3D - Unterrichts Edition</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .animate-shake { animation: shake 0.3s ease-in-out; }
        
        .btn-3d { transition: all 0.1s; box-shadow: 0 6px 0 rgba(0,0,0,0.2); }
        .btn-3d:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0px 0 rgba(0,0,0,0.2); }
        
        .island-3d { box-shadow: 0 10px 0 rgba(0,0,0,0.15); transition: transform 0.2s, box-shadow 0.2s; }
        .island-3d:hover:not(:disabled) { transform: translateY(-5px); box-shadow: 0 15px 0 rgba(0,0,0,0.15); }
        
        .glitch-text { text-shadow: 2px 2px #ff00ff, -2px -2px #00ffff; }
        .neon-text { color: #0ff; text-shadow: 0 0 5px #0ff, 0 0 10px #0ff; }

        .bg-screenshot-sky { background-color: #63bcf8; }
        .bg-screenshot-hill-light { background-color: #2ac754; }
        .bg-screenshot-hill-dark { background-color: #1ea041; }
        .text-screenshot-dark { color: #162032; }
        .bg-screenshot-dark { background-color: #162032; }
        .bg-screenshot-panel { background-color: #21324d; }
    </style>
</head>
<body class="bg-gray-100 overflow-x-hidden font-sans select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const shuffleArray = (array) => {
            let newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        };

        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        // --- UI HILFS-KOMPONENTEN ---
        const Button3D = ({ children, onClick, color = "blue", className = "", disabled = false }) => {
            const colors = {
                blue: "bg-blue-500 hover:bg-blue-400 text-white",
                green: "bg-green-500 hover:bg-green-400 text-white",
                red: "bg-red-500 hover:bg-red-400 text-white",
                yellow: "bg-yellow-400 hover:bg-yellow-300 text-yellow-900",
                purple: "bg-purple-500 hover:bg-purple-400 text-white",
                gray: "bg-gray-400 hover:bg-gray-300 text-white",
                orange: "bg-orange-500 hover:bg-orange-400 text-white",
                black: "bg-gray-900 hover:bg-gray-800 text-cyan-400 border-2 border-cyan-500",
                teal: "bg-teal-500 hover:bg-teal-400 text-white"
            };
            return (
                <button onClick={onClick} disabled={disabled} className={`btn-3d w-full py-4 font-bold text-xl rounded-2xl ${colors[color]} ${disabled ? 'opacity-50 cursor-not-allowed transform-none shadow-none' : ''} ${className}`}>
                    {children}
                </button>
            );
        };

        const DialogBox = ({ title, icon, children, color = "blue" }) => {
            const styles = {
                blue: "bg-blue-50 border-blue-300 text-blue-800",
                yellow: "bg-yellow-50 border-yellow-300 text-yellow-800",
                red: "bg-red-50 border-red-300 text-red-800",
                green: "bg-green-50 border-green-300 text-green-800",
                purple: "bg-purple-50 border-purple-300 text-purple-800",
                teal: "bg-teal-50 border-teal-300 text-teal-800",
                orange: "bg-orange-50 border-orange-300 text-orange-800",
                black: "bg-gray-900 border-cyan-600 text-cyan-400"
            };
            const isNeon = color === 'black';
            return (
                <div className={`${styles[color].split(' ')[0]} p-6 rounded-3xl border-b-8 border-x-4 border-t-4 ${styles[color].split(' ')[1]} mb-6 shadow-lg`}>
                    <h3 className={`font-black text-2xl ${styles[color].split(' ')[2]} mb-4 flex items-center gap-3`}>
                        <i className={`fa-solid ${icon} text-3xl`}></i> {title}
                    </h3>
                    <div className={`space-y-4 ${isNeon?'font-mono text-cyan-200':'text-gray-700 font-medium'}`}>{children}</div>
                </div>
            );
        };

        const AlgoCharacter = () => (
            <div className="relative flex flex-col items-center animate-bounce z-50 hover:scale-110 transition-transform" style={{ filter: 'drop-shadow(0px 4px 2px rgba(0,0,0,0.3))' }}>
                <div className="absolute -top-6 bg-white text-[9px] font-black px-2 py-0.5 rounded-full border-2 border-emerald-400 text-emerald-600">Algo!</div>
                <div className="relative bg-yellow-50 w-10 h-14 border-[3px] border-gray-500 flex flex-col items-center pt-2 shadow-inner rounded-sm">
                    <div className="absolute -top-1 -right-1 w-0 h-0 border-l-[10px] border-l-transparent border-b-[10px] border-b-gray-400"></div>
                    <div className="absolute -top-1 -right-1 w-0 h-0 border-r-[10px] border-r-sky-300 border-t-[10px] border-t-sky-300"></div>
                    <div className="flex gap-1.5 mb-1"><div className="w-1.5 h-1.5 bg-black rounded-full"></div><div className="w-1.5 h-1.5 bg-black rounded-full"></div></div>
                    <div className="w-3 h-1.5 border-b-2 border-black rounded-full mb-1"></div>
                    <div className="w-5 h-0.5 bg-gray-300 rounded"></div>
                </div>
            </div>
        );

        const ReadTimerButton = ({ onClick, color, children }) => {
            const [timeLeft, setTimeLeft] = useState(20); 
            
            useEffect(() => {
                if (timeLeft > 0) {
                    const timer = setTimeout(() => setTimeLeft(timeLeft - 1), 1000);
                    return () => clearTimeout(timer);
                }
            }, [timeLeft]);
            
            const isWaiting = timeLeft > 0;
            
            return (
                <Button3D color={isWaiting ? "gray" : color} onClick={onClick} disabled={isWaiting}>
                    {isWaiting ? (
                        <span className="flex justify-center items-center gap-2 text-gray-100">
                            <i className="fa-solid fa-hourglass-half animate-spin"></i> Bitte lesen... ({timeLeft}s)
                        </span>
                    ) : children}
                </Button3D>
            );
        };

        const MCLevel = ({ title, icon, color, text, options, onComplete, logError }) => {
            const [opts, setOpts] = useState(() => shuffleArray(options));
            const [errorMsg, setErrorMsg] = useState('');
            const [selectedId, setSelectedId] = useState(null);
            const [isLocked, setIsLocked] = useState(false);

            const handlePick = async (opt) => {
                if(isLocked) return;
                setIsLocked(true);
                setSelectedId(opt.text);

                if(opt.correct) { 
                    setErrorMsg(''); 
                    await sleep(800);
                    onComplete(); 
                } else { 
                    if (logError) logError(`Falsche Antwort: ${opt.text}`);
                    setErrorMsg(opt.msg || 'Falsch! Denk noch einmal genau nach.'); 
                    await sleep(1200);
                    setSelectedId(null);
                    setOpts(shuffleArray([...opts])); 
                    setIsLocked(false);
                }
            };

            return (
                <div className="animate-pop-in">
                    <DialogBox title={title} icon={icon} color={color}>
                        <div className="mb-4">{text}</div>
                        <div className="space-y-3">
                            {opts.map((opt, i) => {
                                let btnStyle = "bg-white hover:bg-gray-50 border-gray-200 text-gray-800";
                                if (selectedId === opt.text) {
                                    btnStyle = opt.correct ? "bg-green-100 border-green-500 text-green-900" : "bg-red-100 border-red-500 text-red-900";
                                }
                                return (
                                    <button key={i} disabled={isLocked} onClick={()=>handlePick(opt)} className={`w-full p-4 rounded-xl border-4 font-bold text-left transition-all ${btnStyle}`}>
                                        {opt.text}
                                    </button>
                                );
                            })}
                        </div>
                    </DialogBox>
                    {errorMsg && <p className="text-center font-bold text-red-500 animate-pop-in">{errorMsg}</p>}
                </div>
            );
        };

        const MCBossGauntlet = ({ title, icon, colorClass, textClass, questions, onComplete, logError }) => {
            const [stage, setStage] = useState(0);
            const [lives, setLives] = useState(3);
            const [opts, setOpts] = useState(() => shuffleArray(questions[0].options));
            const [status, setStatus] = useState('playing');
            const [msg, setMsg] = useState('');
            const [shake, setShake] = useState(false);
            const [selectedId, setSelectedId] = useState(null);
            const [isLocked, setIsLocked] = useState(false);

            const handlePick = async (opt) => {
                if (status !== 'playing' || isLocked) return;
                setIsLocked(true);
                setSelectedId(opt.text);
                
                if (opt.correct) {
                    setMsg('Richtig!');
                    await sleep(800);
                    if (stage < questions.length - 1) {
                        setStage(s => s + 1);
                        setOpts(shuffleArray(questions[stage + 1].options));
                        setMsg('');
                        setSelectedId(null);
                        setIsLocked(false);
                    } else {
                        setStatus('won');
                    }
                } else {
                    if (logError) logError(`Frage ${stage + 1}: Falsche Antwort gewählt (${opt.text})`);
                    setShake(true); setTimeout(() => setShake(false), 300);
                    setMsg('Falsch!');
                    await sleep(1200);
                    
                    if (lives > 1) {
                        setLives(l => l - 1);
                        setMsg('Du verlierst ein Leben!');
                        setOpts(shuffleArray([...opts]));
                        setSelectedId(null);
                        setIsLocked(false);
                    } else {
                        setLives(0);
                        setStatus('gameover');
                    }
                }
            };

            const restart = () => {
                setLives(3); setStage(0); setStatus('playing'); setMsg('');
                setOpts(shuffleArray(questions[0].options));
                setSelectedId(null);
                setIsLocked(false);
            };

            if (status === 'won') {
                return (
                    <div className="text-center animate-pop-in mt-6">
                        <i className={`fa-solid fa-trophy text-7xl ${textClass} mb-4 animate-bounce`}></i>
                        <h2 className="text-3xl font-black mb-4">Boss besiegt!</h2>
                        <p className="text-gray-600 font-bold mb-6">Alle Fragen richtig beantwortet!</p>
                        <Button3D color="purple" onClick={onComplete}>Weiter 🚀</Button3D>
                    </div>
                );
            }

            if (status === 'gameover') {
                return (
                    <div className="text-center animate-pop-in bg-red-100 p-8 rounded-3xl border-4 border-red-500">
                        <i className="fa-solid fa-skull-crossbones text-7xl text-red-500 mb-4 animate-float"></i>
                        <h2 className="text-3xl font-black mb-4 text-red-700">GAME OVER</h2>
                        <p className="text-red-900 font-bold mb-6">Du hast alle 3 Leben verloren. Der Boss hat dich besiegt!</p>
                        <Button3D color="red" onClick={restart}>Erneut Versuchen</Button3D>
                    </div>
                );
            }

            return (
                <div className={`text-center animate-pop-in ${shake ? 'animate-shake' : ''}`}>
                    <div className="flex justify-between items-center mb-2 px-4">
                        <div className="flex gap-1">
                            {[1, 2, 3].map(i => <i key={i} className={`fa-solid fa-heart text-2xl ${i <= lives ? 'text-red-500 animate-pulse' : 'text-gray-300'}`}></i>)}
                        </div>
                        <div className="font-black text-gray-500 bg-gray-200 px-3 py-1 rounded-full text-sm">Frage {stage + 1} / {questions.length}</div>
                    </div>

                    <i className={`fa-solid ${icon} text-6xl ${textClass} mb-2 animate-float block`}></i>
                    <h2 className="text-3xl font-black mb-4">{title}</h2>
                    
                    <div className="flex flex-col md:flex-row gap-6 mb-6">
                        <div className={`md:w-1/2 ${colorClass} p-4 rounded-2xl border-4 font-bold text-sm text-left shadow-inner flex flex-col justify-center`}>
                            {questions[stage].q}
                        </div>

                        <div className="md:w-1/2 space-y-3 text-left flex flex-col justify-center">
                            {opts.map((opt, i) => {
                                let btnStyle = "bg-white hover:border-gray-400 border-gray-300 text-gray-800";
                                if (selectedId === opt.text) {
                                    btnStyle = opt.correct ? "border-green-500 bg-green-100 text-green-900" : "border-red-500 bg-red-100 text-red-900";
                                }
                                return (
                                    <button key={i} disabled={isLocked} onClick={() => handlePick(opt)} className={`w-full p-4 rounded-2xl border-4 font-bold text-sm transition-colors ${btnStyle}`}>
                                        {opt.text}
                                    </button>
                                );
                            })}
                        </div>
                    </div>
                    {msg && <p className={`font-black text-xl ${msg==='Richtig!' ? 'text-green-500' : 'text-red-500'}`}>{msg}</p>}
                </div>
            );
        };

        const DnDBossGauntlet = ({ title, icon, colorClass, textClass, tasks, onComplete, logError }) => {
            const [stage, setStage] = useState(0);
            const [lives, setLives] = useState(3);
            const [slots, setSlots] = useState({});
            const [selectedId, setSelectedId] = useState(null);
            const [msg, setMsg] = useState('');
            const [shake, setShake] = useState(false);
            const [status, setStatus] = useState('playing');

            const task = tasks[stage];

            const handleBlockClick = (bId) => {
                if (selectedId === bId) setSelectedId(null);
                else setSelectedId(bId);
            };

            const handleSlotClick = (slotIdx) => {
                if (selectedId) {
                    setSlots({...slots, [slotIdx]: selectedId});
                    setSelectedId(null);
                } else if (slots[slotIdx]) {
                    const newSlots = {...slots};
                    delete newSlots[slotIdx];
                    setSlots(newSlots);
                }
            };

            const checkSolution = async () => {
                let correct = true;
                if (Object.keys(slots).length !== task.solution.length) correct = false;
                for (let i = 0; i < task.solution.length; i++) {
                    if (slots[i] !== task.solution[i]) correct = false;
                }

                if (correct) {
                    setMsg('Richtig!');
                    await sleep(1000);
                    if (stage < tasks.length - 1) {
                        setStage(s => s + 1);
                        setSlots({});
                        setMsg('');
                        setSelectedId(null);
                    } else {
                        setStatus('won');
                    }
                } else {
                    if (logError) logError(`Fehler beim Diagrammbau (${task.title})`);
                    setShake(true); setTimeout(() => setShake(false), 300);
                    setMsg('Da ist noch ein Fehler!');
                    await sleep(1200);
                    if (lives > 1) {
                        setLives(l => l - 1);
                        setMsg('Du verlierst ein Leben!');
                        setSlots({});
                        setSelectedId(null);
                    } else {
                        setStatus('gameover');
                    }
                }
            };

            const restart = () => {
                setLives(3); setStage(0); setStatus('playing'); setMsg('');
                setSlots({}); setSelectedId(null);
            };

            if (status === 'won') {
                return (
                    <div className="text-center animate-pop-in mt-6">
                        <i className={`fa-solid fa-trophy text-7xl ${textClass} mb-4 animate-bounce`}></i>
                        <h2 className="text-3xl font-black mb-4">Meisterprüfung bestanden!</h2>
                        <p className="text-gray-600 font-bold mb-6">Du hast alle Diagramme perfekt zusammengebaut!</p>
                        <Button3D color="purple" onClick={onComplete}>Weiter 🚀</Button3D>
                    </div>
                );
            }

            if (status === 'gameover') {
                return (
                    <div className="text-center animate-pop-in bg-red-100 p-8 rounded-3xl border-4 border-red-500">
                        <i className="fa-solid fa-skull-crossbones text-7xl text-red-500 mb-4 animate-float"></i>
                        <h2 className="text-3xl font-black mb-4 text-red-700">GAME OVER</h2>
                        <p className="text-red-900 font-bold mb-6">Du hast alle 3 Leben verloren.</p>
                        <Button3D color="red" onClick={restart}>Erneut Versuchen</Button3D>
                    </div>
                );
            }

            const Slot = ({ idx, shape }) => {
                const blockId = slots[idx];
                const block = task.blocks.find(b => b.id === blockId);
                let baseClasses = "flex items-center justify-center font-bold text-sm min-h-[50px] transition-all cursor-pointer ";
                
                if (block) {
                    baseClasses += "bg-blue-100 border-4 border-blue-500 text-blue-900 shadow-md p-3 ";
                } else {
                    baseClasses += "bg-white border-4 border-dashed border-gray-400 text-gray-400 p-3 ";
                    if (selectedId) baseClasses += "hover:bg-yellow-100 hover:border-yellow-400 ";
                }

                if (shape === 'oval') baseClasses += "rounded-full w-[160px] mx-auto";
                else if (shape === 'rect') baseClasses += "rounded-xl w-[200px] mx-auto";
                else if (shape === 'diamond') baseClasses += "[clip-path:polygon(50%_0%,100%_50%,50%_100%,0%_50%)] bg-orange-50 border-orange-400 w-[200px] h-[100px] mx-auto " + (block ? "bg-orange-200 border-solid" : "");
                else baseClasses += "rounded-md w-full h-full";

                return (
                    <div onClick={() => handleSlotClick(idx)} className={baseClasses}>
                        {block ? block.text : (selectedId ? 'Hier tippen' : '...')}
                    </div>
                );
            };

            const Arrow = () => <div className="text-gray-400 text-xl my-1 flex justify-center w-full"><i className="fa-solid fa-arrow-down"></i></div>;

            return (
                <div className={`text-center animate-pop-in ${shake ? 'animate-shake' : ''}`}>
                    <div className="flex justify-between items-center mb-2 px-4">
                        <div className="flex gap-1">
                            {[1, 2, 3].map(i => <i key={i} className={`fa-solid fa-heart text-2xl ${i <= lives ? 'text-red-500 animate-pulse' : 'text-gray-300'}`}></i>)}
                        </div>
                        <div className="font-black text-gray-500 bg-gray-200 px-3 py-1 rounded-full text-sm">Prüfung {stage + 1} / {tasks.length}</div>
                    </div>

                    <h2 className={`text-2xl font-black mb-4 ${textClass}`}>{title}: {task.title}</h2>
                    <p className="bg-gray-100 p-3 rounded-2xl border-4 border-gray-300 font-bold mb-4 text-sm text-gray-700 shadow-inner">
                        Wähle einen Block unten aus und tippe dann auf ein leeres Feld im Diagramm!
                    </p>

                    <div className="flex flex-wrap gap-2 justify-center mb-6 min-h-[80px] p-4 bg-gray-200 rounded-xl border-4 border-gray-300 shadow-inner">
                        {task.blocks.map(b => {
                            const isPlaced = Object.values(slots).includes(b.id);
                            if (isPlaced) return null;
                            const isSelected = selectedId === b.id;
                            return (
                                <button
                                    key={b.id}
                                    onClick={() => handleBlockClick(b.id)}
                                    className={`px-4 py-2 rounded-xl font-bold shadow-sm transition-all border-4 text-sm
                                        ${isSelected ? 'bg-yellow-300 border-yellow-500 text-yellow-900 scale-110' : 'bg-white border-gray-400 text-gray-700 hover:border-blue-400'}`}
                                >
                                    {b.text}
                                </button>
                            )
                        })}
                        {Object.values(slots).length === task.solution.length && <span className="text-green-600 font-bold text-lg flex items-center w-full justify-center"><i className="fa-solid fa-check-circle mr-2"></i> Alle verbaut!</span>}
                    </div>

                    <div className="mb-6 flex justify-center bg-white p-6 rounded-2xl border-4 border-gray-200 shadow-sm min-h-[300px] items-center">
                        
                        {task.layout === 'flow-3' && (
                            <div className="flex flex-col items-center">
                                <Slot idx={0} shape="oval" /> <Arrow /> <Slot idx={1} shape="rect" /> <Arrow /> <Slot idx={2} shape="oval" />
                            </div>
                        )}

                        {task.layout === 'flow-4' && (
                            <div className="flex flex-col items-center">
                                <Slot idx={0} shape="oval" /> <Arrow /> <Slot idx={1} shape="rect" /> <Arrow /> <Slot idx={2} shape="rect" /> <Arrow /> <Slot idx={3} shape="oval" />
                            </div>
                        )}

                        {task.layout === 'flow-branch' && (
                            <div className="flex flex-col items-center w-full max-w-md">
                                <Slot idx={0} shape="diamond" />
                                <div className="flex w-full justify-center relative my-2">
                                    <div className="w-[120px] border-t-4 border-l-4 border-gray-400 h-6 relative rounded-tl-xl"><span className="absolute -top-3 left-4 text-xs font-bold bg-white px-1 text-green-600">JA</span></div>
                                    <div className="w-[120px] border-t-4 border-r-4 border-gray-400 h-6 relative rounded-tr-xl"><span className="absolute -top-3 right-4 text-xs font-bold bg-white px-1 text-red-600">NEIN</span></div>
                                </div>
                                <div className="flex w-full gap-4 justify-center">
                                    <div className="w-[140px]"><Slot idx={1} shape="rect" /></div>
                                    <div className="w-[140px]"><Slot idx={2} shape="rect" /></div>
                                </div>
                            </div>
                        )}

                        {task.layout === 'struct-2' && (
                            <div className="flex flex-col w-[250px] border-4 border-black bg-gray-50">
                                <div className="border-b-4 border-black h-[60px]"><Slot idx={0} shape="none" /></div>
                                <div className="h-[60px]"><Slot idx={1} shape="none" /></div>
                            </div>
                        )}

                        {task.layout === 'struct-3' && (
                            <div className="flex flex-col w-[250px] border-4 border-black bg-gray-50">
                                <div className="border-b-4 border-black h-[60px]"><Slot idx={0} shape="none" /></div>
                                <div className="border-b-4 border-black h-[60px]"><Slot idx={1} shape="none" /></div>
                                <div className="h-[60px]"><Slot idx={2} shape="none" /></div>
                            </div>
                        )}

                        {task.layout === 'struct-if' && (
                            <div className="flex flex-col w-full max-w-md border-4 border-black bg-gray-50">
                                <div className="relative border-b-4 border-black h-[80px] flex items-center justify-center bg-gray-200">
                                    <svg className="absolute inset-0 w-full h-full pointer-events-none"><line x1="0" y1="0" x2="50%" y2="100%" stroke="black" strokeWidth="4"/><line x1="100%" y1="0" x2="50%" y2="100%" stroke="black" strokeWidth="4"/></svg>
                                    <div className="z-10 w-[60%] h-[45px]"><Slot idx={0} shape="none" /></div>
                                    <span className="absolute bottom-1 left-2 text-xs font-black text-green-700 z-10">JA</span>
                                    <span className="absolute bottom-1 right-2 text-xs font-black text-red-700 z-10">NEIN</span>
                                </div>
                                <div className="flex w-full h-[70px]">
                                    <div className="w-1/2 border-r-4 border-black"><Slot idx={1} shape="none" /></div>
                                    <div className="w-1/2"><Slot idx={2} shape="none" /></div>
                                </div>
                            </div>
                        )}

                        {task.layout === 'struct-loop' && (
                            <div className="flex flex-col w-[300px] border-4 border-black bg-gray-50">
                                <div className="border-b-4 border-black h-[60px] bg-yellow-100 p-1 pl-8 relative flex items-center">
                                    <span className="absolute left-2 font-black text-yellow-600"><i className="fa-solid fa-rotate-right"></i></span>
                                    <div className="w-full h-full p-1"><Slot idx={0} shape="none" /></div>
                                </div>
                                <div className="flex h-[70px]">
                                    <div className="w-8 border-r-4 border-black bg-yellow-100"></div>
                                    <div className="flex-1"><Slot idx={1} shape="none" /></div>
                                </div>
                            </div>
                        )}

                    </div>

                    <Button3D color="green" onClick={checkSolution} disabled={Object.keys(slots).length !== task.solution.length}>
                        DIAGRAMM PRÜFEN
                    </Button3D>
                    
                    {msg && <p className={`font-black text-xl mt-4 ${msg==='Richtig!' ? 'text-green-500' : 'text-red-500'}`}>{msg}</p>}
                </div>
            );
        };

        // UNIFIED ROBOTER SEQUENCE GAME COMPONENT
        const RoboSequenceGame = ({ title, desc, stages, maxCmds = 8, isBoss = false, onComplete, logError }) => {
            const [stage, setStage] = useState(0);
            const [lives, setLives] = useState(3);
            const [seq, setSeq] = useState([]);
            const [status, setStatus] = useState('idle');
            const [msg, setMsg] = useState('');
            const [shake, setShake] = useState(false);

            const current = stages[stage];
            const [pos, setPos] = useState(current.start);
            const size = current.size;

            const run = async () => {
                setStatus('running'); setMsg('');
                let cx = current.start.x, cy = current.start.y;
                setPos({x: cx, y: cy});
                await sleep(400);

                for (let cmd of seq) {
                    if (cmd === 'U') cy -= 1; if (cmd === 'D') cy += 1; if (cmd === 'L') cx -= 1; if (cmd === 'R') cx += 1;
                    setPos({x: cx, y: cy});
                    await sleep(400);
                    if (cx < 0 || cx >= size || cy < 0 || cy >= size) {
                        handleFail('Crash! Rand berührt!'); return;
                    }
                    if (current.walls && current.walls.some(w => w.x === cx && w.y === cy)) {
                        handleFail('Crash! Wand/Hindernis berührt!'); return;
                    }
                }

                if (cx === current.target.x && cy === current.target.y) {
                    setMsg('Ziel erreicht!');
                    setStatus('win');
                    await sleep(1000);
                    if (stage < stages.length - 1) {
                        setStage(s => s + 1);
                        setPos(stages[stage+1].start);
                        setSeq([]);
                        setStatus('idle');
                        setMsg('');
                    } else {
                        setStatus('game_won');
                    }
                } else {
                    handleFail('Ziel verfehlt!');
                }
            };

            const handleFail = (message) => {
                if (logError) logError(`Runde ${stage + 1}: ${message}`);
                setShake(true); setTimeout(() => setShake(false), 300);
                if (isBoss) {
                    if (lives > 1) {
                        setLives(l => l - 1);
                        setMsg(message + ' Du verlierst ein Leben!');
                        setStatus('fail');
                    } else {
                        setLives(0);
                        setStatus('gameover');
                    }
                } else {
                    setMsg(message);
                    setStatus('fail');
                }
            };

            const reset = () => { setPos(current.start); setStatus('idle'); setMsg(''); setSeq([]); };
            const fullRestart = () => { setLives(3); setStage(0); setPos(stages[0].start); setStatus('idle'); setSeq([]); };

            const addCmd = (c) => { if(status === 'idle' && seq.length < maxCmds) setSeq([...seq, c]); };
            const delCmd = () => { if(status === 'idle' && seq.length > 0) setSeq(seq.slice(0,-1)); };

            if (status === 'gameover') {
                return (
                    <div className="text-center animate-pop-in bg-red-100 p-8 rounded-3xl border-4 border-red-500">
                        <i className="fa-solid fa-skull-crossbones text-7xl text-red-500 mb-4 animate-float"></i>
                        <h2 className="text-3xl font-black mb-4 text-red-700">GAME OVER</h2>
                        <p className="text-red-900 font-bold mb-6">Du hast alle 3 Leben verloren. Der Boss hat dich besiegt!</p>
                        <Button3D color="red" onClick={fullRestart}>Erneut Versuchen</Button3D>
                    </div>
                );
            }

            if (status === 'game_won') {
                return (
                    <div className="animate-pop-in text-center mt-4">
                        <i className="fa-solid fa-trophy text-7xl text-yellow-500 mb-4 animate-bounce"></i>
                        <p className="text-green-600 font-black text-3xl mb-2">Perfekt navigiert!</p>
                        <p className="text-gray-600 font-bold mb-6">{isBoss ? "Boss besiegt!" : "Level geschafft!"}</p>
                        <Button3D color="purple" onClick={onComplete}>Weiter 🚀</Button3D>
                    </div>
                );
            }

            return (
                <div className={`text-center animate-pop-in ${shake ? 'animate-shake' : ''}`}>
                    {isBoss && (
                        <div className="flex justify-between items-center mb-2 px-4">
                            <div className="flex gap-1">{[1, 2, 3].map(i => <i key={i} className={`fa-solid fa-heart text-2xl ${i <= lives ? 'text-red-500 animate-pulse' : 'text-gray-300'}`}></i>)}</div>
                            <div className="font-black text-gray-500 bg-gray-200 px-3 py-1 rounded-full text-sm">Runde {stage + 1} / {stages.length}</div>
                        </div>
                    )}

                    <h2 className="text-3xl font-black mb-2 text-gray-800">{title}</h2>
                    <p className="bg-gray-100 p-3 rounded-2xl border-4 border-gray-300 font-bold mb-4 text-xs md:text-sm text-left text-gray-700">
                        {desc} <br/> <span className="text-gray-500">(Max. {maxCmds} Befehle)</span>
                    </p>

                    <div className="relative mx-auto mb-4 bg-gray-800 border-4 border-gray-900 rounded-xl shadow-inner overflow-hidden" style={{ width: '100%', maxWidth: '280px', aspectRatio: '1/1' }}>
                        <div className="absolute inset-0 grid" style={{ gridTemplateColumns: `repeat(${size}, 1fr)`, gridTemplateRows: `repeat(${size}, 1fr)` }}>
                            {Array.from({length: size * size}).map((_, i) => {
                                const x = i % size;
                                const y = Math.floor(i / size);
                                const isWall = current.walls && current.walls.some(w => w.x === x && w.y === y);
                                return <div key={i} className={`border-2 border-gray-500 ${isWall ? 'bg-orange-800' : 'bg-gray-700/30'}`}></div>;
                            })}
                        </div>
                        {current.walls && current.walls.map((w, i) => (
                            <div key={i} className="absolute flex items-center justify-center" style={{ left: `${(w.x / size) * 100}%`, top: `${(w.y / size) * 100}%`, width: `${100/size}%`, height: `${100/size}%` }}>
                                <i className="fa-solid fa-brick text-orange-900 opacity-50"></i>
                            </div>
                        ))}
                        <div className="absolute flex items-center justify-center bg-green-500 border-2 border-green-700" style={{ left: `${(current.target.x / size) * 100}%`, top: `${(current.target.y / size) * 100}%`, width: `${100/size}%`, height: `${100/size}%` }}><i className="fa-solid fa-door-open text-white text-xl"></i></div>
                        <div className="absolute flex items-center justify-center transition-all duration-400 ease-in-out z-10" style={{ left: `${(pos.x / size) * 100}%`, top: `${(pos.y / size) * 100}%`, width: `${100/size}%`, height: `${100/size}%` }}><i className={`fa-solid ${status === 'fail' ? 'fa-explosion text-red-500 scale-125' : 'fa-robot text-cyan-400'} text-2xl drop-shadow-md`}></i></div>
                    </div>

                    <div className="bg-white border-2 border-gray-300 rounded-xl p-2 mb-4 min-h-[50px] flex items-center justify-start gap-1 flex-wrap shadow-inner text-xl">
                        {seq.length === 0 && <span className="text-gray-400 text-sm font-bold ml-2">Code leer...</span>}
                        {seq.map((c, i) => <span key={i}>{c==='U'?'⬆️':c==='D'?'⬇️':c==='L'?'⬅️':'➡️'}</span>)}
                    </div>

                    {status === 'idle' && (
                        <div className="space-y-2">
                            <div className="flex justify-center gap-2">
                                <button onClick={()=>addCmd('U')} className="bg-gray-100 border-2 border-gray-300 p-2 rounded-xl shadow-sm hover:bg-gray-200 flex flex-col items-center justify-center w-16"><span className="text-xl">⬆️</span><span className="text-[10px] font-bold mt-1 uppercase text-gray-600">Hoch</span></button>
                                <button onClick={()=>addCmd('D')} className="bg-gray-100 border-2 border-gray-300 p-2 rounded-xl shadow-sm hover:bg-gray-200 flex flex-col items-center justify-center w-16"><span className="text-xl">⬇️</span><span className="text-[10px] font-bold mt-1 uppercase text-gray-600">Runter</span></button>
                                <button onClick={()=>addCmd('L')} className="bg-gray-100 border-2 border-gray-300 p-2 rounded-xl shadow-sm hover:bg-gray-200 flex flex-col items-center justify-center w-16"><span className="text-xl">⬅️</span><span className="text-[10px] font-bold mt-1 uppercase text-gray-600">Links</span></button>
                                <button onClick={()=>addCmd('R')} className="bg-gray-100 border-2 border-gray-300 p-2 rounded-xl shadow-sm hover:bg-gray-200 flex flex-col items-center justify-center w-16"><span className="text-xl">➡️</span><span className="text-[10px] font-bold mt-1 uppercase text-gray-600">Rechts</span></button>
                                <button onClick={delCmd} className="bg-red-100 border-2 border-red-300 p-2 rounded-xl shadow-sm hover:bg-red-200 flex flex-col items-center justify-center w-16 text-red-600"><i className="fa-solid fa-delete-left text-xl"></i><span className="text-[10px] font-bold mt-1 uppercase">Lösch</span></button>
                            </div>
                            <Button3D color="blue" onClick={run} disabled={seq.length===0} className="py-2">AUSFÜHREN</Button3D>
                        </div>
                    )}

                    {status === 'running' && <p className="text-blue-600 font-black animate-pulse">Roboter fährt...</p>}
                    {status === 'fail' && <div className="animate-pop-in"><p className="text-red-500 font-bold mb-2">{msg}</p><Button3D color="red" className="py-2" onClick={reset}>Neustart</Button3D></div>}
                    {status === 'win' && <p className="text-green-600 font-black text-xl animate-bounce">{msg}</p>}
                </div>
            );
        };

        // --- WELT 7: ROBO-ARENA (MINI-GAME) ---
        const RoboArenaGame = ({ onComplete, logError }) => {
            const [level, setLevel] = useState(1);
            const maxLevel = 18; 
            const size = Math.floor((level - 1) / 3) + 3;

            const [timeLeft, setTimeLeft] = useState(45);
            const [status, setStatus] = useState('start'); 
            const [failReason, setFailReason] = useState('');
            const [seq, setSeq] = useState([]);
            const [pos, setPos] = useState({x: 0, y: 0, dir: 90}); 
            const [target, setTarget] = useState({x: size-1, y: size-1});
            const [walls, setWalls] = useState([]);

            // --- POINTS SYSTEM ---
            const [score, setScore] = useState(0);
            const [checkpointScore, setCheckpointScore] = useState(0);
            const [lastEarned, setLastEarned] = useState(0);

            useEffect(() => { if (status === 'start') generateLevel(level); }, [level, status]);

            const generateLevel = (lvl) => {
                const s = Math.floor((lvl - 1) / 3) + 3;
                let path = new Set();
                let cx = 0, cy = 0;
                path.add(`0,0`);
                while (cx < s - 1 || cy < s - 1) {
                    if (cx === s - 1) cy++; else if (cy === s - 1) cx++; else { if (Math.random() < 0.5) cx++; else cy++; }
                    path.add(`${cx},${cy}`);
                }
                
                let newWalls = [];
                let numWalls = Math.floor(s * s * 0.25); 
                for (let i=0; i<200 && newWalls.length < numWalls; i++) {
                    let wx = Math.floor(Math.random() * s); let wy = Math.floor(Math.random() * s);
                    if (!path.has(`${wx},${wy}`) && !newWalls.some(w => w.x===wx && w.y===wy)) { newWalls.push({x: wx, y: wy}); }
                }
                setWalls(newWalls); setPos({x: 0, y: 0, dir: 90}); setTarget({x: s-1, y: s-1});
                setSeq([]); setTimeLeft(45); setStatus('playing');
            };

            useEffect(() => {
                let timer;
                if (status === 'playing' && timeLeft > 0) timer = setTimeout(() => setTimeLeft(t => t - 1), 1000);
                else if (status === 'playing' && timeLeft === 0) { 
                    setStatus('failed'); 
                    setFailReason('Zeit abgelaufen!'); 
                    if(logError) logError('Zeit abgelaufen in Lvl ' + level);
                }
                return () => clearTimeout(timer);
            }, [timeLeft, status]);

            const runCode = async () => {
                if (status !== 'playing') return;
                setStatus('running');
                let cx = 0, cy = 0, cdir = 90;
                setPos({x: cx, y: cy, dir: cdir});
                await sleep(300);

                for (let cmd of seq) {
                    if (cmd === 'V') {
                        let norm = ((cdir % 360) + 360) % 360;
                        if (norm === 0) cy -= 1; if (norm === 90) cx += 1; if (norm === 180) cy += 1; if (norm === 270) cx -= 1;
                    } else if (cmd === 'R') cdir += 90; else if (cmd === 'L') cdir -= 90;
                    setPos({x: cx, y: cy, dir: cdir});
                    await sleep(300);
                    if (cx < 0 || cx >= size || cy < 0 || cy >= size || walls.some(w => w.x === cx && w.y === cy)) {
                        setStatus('failed'); 
                        setFailReason('Crash! Wand oder Rand berührt.'); 
                        if(logError) logError('Crash in Lvl ' + level);
                        return;
                    }
                }
                if (cx === target.x && cy === target.y) { 
                    const earned = 50 + (timeLeft * 10);
                    setLastEarned(earned);
                    setScore(s => s + earned);

                    if (level === maxLevel) {
                        setStatus('won_game'); 
                    } else {
                        setStatus('passed'); 
                    } 
                } 
                else { 
                    setStatus('failed'); 
                    setFailReason('Ziel nicht erreicht!'); 
                    if(logError) logError('Ziel verfehlt in Lvl ' + level);
                }
            };

            const restartFromCheckpoint = () => { 
                setLevel(Math.floor((level - 1) / 3) * 3 + 1); 
                setScore(checkpointScore); 
                setStatus('start'); 
            };
            const nextLevel = () => { 
                const nextLvl = level + 1;
                setLevel(nextLvl); 
                if ((nextLvl - 1) % 3 === 0) {
                    setCheckpointScore(score + lastEarned);
                }
                setStatus('start'); 
            };
            const addCmd = (c) => { if (seq.length < 25) setSeq([...seq, c]); };
            const delCmd = () => { if (seq.length > 0) setSeq(seq.slice(0, -1)); };

            if (status === 'won_game') {
                return (
                    <div className="text-center animate-pop-in">
                        <i className="fa-solid fa-trophy text-8xl text-yellow-400 mb-6 animate-float block drop-shadow-[0_0_15px_yellow]"></i>
                        <h2 className="text-5xl font-black mb-4 text-cyan-400 glitch-text font-mono">ARENA BEZWUNGEN!</h2>
                        <p className="text-white text-xl font-mono mb-4">Du hast alle 18 Level überstanden!</p>
                        <p className="text-yellow-400 text-3xl font-black font-mono mb-8">ENDSTAND: {score} PUNKTE</p>
                        <Button3D color="black" onClick={onComplete}>ZURÜCK ZUR KARTE</Button3D>
                    </div>
                );
            }

            return (
                <div className="w-full flex flex-col font-mono text-white animate-fade-in-up">
                    <div className="flex justify-between items-center bg-gray-900 border-2 border-cyan-500 rounded-xl p-4 mb-4 shadow-[0_0_10px_#00ffff]">
                        <div>
                            <p className="text-cyan-400 font-bold text-xl">Lvl {level}/18</p>
                            <p className="text-yellow-400 text-sm font-bold shadow-sm">{score} PKT</p>
                        </div>
                        <div className={`text-4xl font-black ${timeLeft <= 10 ? 'text-red-500 animate-pulse' : 'text-white'}`}>
                            00:{timeLeft < 10 ? `0${timeLeft}` : timeLeft}
                        </div>
                    </div>

                    {status === 'failed' && (
                        <div className="bg-red-900 border-4 border-red-500 p-6 rounded-xl text-center mb-4 animate-pop-in shadow-[0_0_20px_red]">
                            <p className="text-3xl font-black mb-2 text-white">GAME OVER</p>
                            <p className="text-red-300 font-bold mb-6">{failReason}</p>
                            <Button3D color="red" onClick={restartFromCheckpoint}>Zum Checkpoint (Lvl {Math.floor((level - 1) / 3) * 3 + 1})</Button3D>
                        </div>
                    )}

                    {status === 'passed' && (
                        <div className="bg-green-900 border-4 border-green-500 p-6 rounded-xl text-center mb-4 animate-pop-in shadow-[0_0_20px_#22c55e]">
                            <p className="text-3xl font-black mb-2 text-white">LEVEL GESCHAFFT!</p>
                            <div className="text-green-300 font-bold mb-6 space-y-2">
                                <p>Level geschafft: +50 Pkt</p>
                                <p>Zeit-Bonus ({timeLeft}s): +{timeLeft * 10} Pkt</p>
                                <p className="text-2xl text-yellow-400 mt-2">+{lastEarned} PUNKTE!</p>
                            </div>
                            <Button3D color="green" onClick={nextLevel}>Nächstes Level</Button3D>
                        </div>
                    )}

                    {(status === 'playing' || status === 'running') && (
                        <>
                            <div className="relative mx-auto bg-gray-700 border-4 border-gray-600 shadow-inner overflow-hidden mb-4" style={{ width: '100%', maxWidth: '350px', aspectRatio: '1/1' }}>
                                <div className="absolute inset-0 grid" style={{ gridTemplateColumns: `repeat(${size}, minmax(0, 1fr))` }}>
                                    {Array.from({length: size * size}).map((_, i) => {
                                        const x = i % size; const y = Math.floor(i / size);
                                        const isWall = walls.some(w => w.x === x && w.y === y);
                                        const isT = x === target.x && y === target.y;
                                        const isR = pos.x === x && pos.y === y;
                                        return (
                                            <div key={i} className={`border-2 border-cyan-800/60 relative flex items-center justify-center ${isWall ? 'bg-cyan-900/60' : 'bg-gray-800/80'}`}>
                                                {isWall && <i className="fa-solid fa-cube text-cyan-700/50"></i>}
                                                {isT && <i className="fa-solid fa-flag text-green-500 text-xl md:text-2xl animate-pulse drop-shadow-[0_0_5px_#22c55e]"></i>}
                                                {isR && <div className="absolute z-10 transition-all duration-300" style={{transform: `rotate(${pos.dir}deg)`}}><i className="fa-solid fa-robot text-cyan-400 text-2xl md:text-3xl drop-shadow-[0_0_8px_#00ffff]"></i></div>}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="bg-gray-900 border-2 border-gray-600 rounded-xl p-2 mb-4 min-h-[60px] flex items-center justify-start gap-1 flex-wrap">
                                {seq.map((c, i) => <span key={i} className="bg-cyan-900 border border-cyan-500 text-cyan-100 font-bold px-2 py-1 rounded text-sm">{c==='V'?'Vor':c==='R'?'Rechts':'Links'}</span>)}
                            </div>

                            <div className="space-y-2">
                                <div className="flex justify-center gap-2">
                                    <button onClick={()=>addCmd('V')} disabled={status==='running'} className="flex-1 bg-gray-800 hover:bg-gray-700 border-2 border-gray-600 p-2 rounded-xl flex flex-col items-center justify-center"><i className="fa-solid fa-arrow-up text-cyan-400 text-xl"></i><span className="text-[10px] text-cyan-100 font-bold mt-1 tracking-wider uppercase">Vor</span></button>
                                    <button onClick={()=>addCmd('L')} disabled={status==='running'} className="flex-1 bg-gray-800 hover:bg-gray-700 border-2 border-gray-600 p-2 rounded-xl flex flex-col items-center justify-center"><i className="fa-solid fa-arrow-rotate-left text-cyan-400 text-xl"></i><span className="text-[10px] text-cyan-100 font-bold mt-1 tracking-wider uppercase">Links</span></button>
                                    <button onClick={()=>addCmd('R')} disabled={status==='running'} className="flex-1 bg-gray-800 hover:bg-gray-700 border-2 border-gray-600 p-2 rounded-xl flex flex-col items-center justify-center"><i className="fa-solid fa-arrow-rotate-right text-cyan-400 text-xl"></i><span className="text-[10px] text-cyan-100 font-bold mt-1 tracking-wider uppercase">Rechts</span></button>
                                    <button onClick={delCmd} disabled={status==='running'||seq.length===0} className="w-16 bg-red-900/50 hover:bg-red-800 border-2 border-red-700 text-red-400 p-2 rounded-xl flex flex-col items-center justify-center"><i className="fa-solid fa-delete-left text-xl"></i><span className="text-[10px] font-bold mt-1 uppercase">Lösch</span></button>
                                </div>
                                <Button3D color="black" onClick={runCode} disabled={status==='running' || seq.length===0}>PROGRAMM STARTEN</Button3D>
                            </div>
                        </>
                    )}
                </div>
            );
        };


        // --- LEVEL INHALTE ---

        // WELT 1: GRUNDLAGEN
        const L1_1 = ({ onComplete }) => (
            <div className="animate-pop-in">
                <DialogBox title="Der Algorithmus" icon="fa-scroll" color="green">
                    <p><b>Algo ruft:</b> "Willkommen! Ich bin Algo, der kleine Notizzettel. Ich helfe dir beim Programmieren!"</p>
                    <p>Ein <strong>Algorithmus</strong> ist eine <strong>Abfolge von Anweisungen</strong>, mit der man ein Problem löst.</p>
                    <p>Das ist wie ein Kochrezept, eine Bastelanleitung für Lego oder der Weg zur Schule. Jeder Schritt ist eine kleine, klare Anweisung.</p>
                </DialogBox>
                <ReadTimerButton color="green" onClick={onComplete}>Anweisungen verstehen! 👍</ReadTimerButton>
            </div>
        );
        const L1_2 = ({ onComplete, logError }) => (
            <MCLevel 
                title="Abläufe im Alltag" icon="fa-calendar-day" color="yellow"
                text="Algo fragt: Ein Algorithmus ist ein Ablauf. Welches dieser Beispiele ist ein Ablauf, bei dem man die einzelnen Schritte auf keinen Fall vertauschen darf?"
                options={[
                    { text: "Ein Glas Wasser einschenken und austrinken.", correct: true },
                    { text: "Schulsachen in den Ranzen packen (Heft, Stifte, Buch).", correct: false, msg: "Ob du erst das Heft oder den Stift einpackst, ist für das Ergebnis egal." },
                    { text: "Das Zimmer aufräumen (Müll wegwerfen, Bett machen).", correct: false, msg: "Die Reihenfolge beim Aufräumen ist meistens egal." },
                    { text: "Freunde auf dem Schulhof begrüßen.", correct: false, msg: "Wen du zuerst begrüßt, ändert nichts am Ergebnis." }
                ]}
                onComplete={onComplete}
                logError={logError}
            />
        );
        const L1_3 = ({ onComplete, logError }) => (
            <MCBossGauntlet
                title="Boss: Anweisungen erkennen" icon="fa-bullhorn" colorClass="bg-green-100 border-green-300 text-green-900" textClass="text-green-600"
                questions={[
                    { q: "Welche dieser Aussagen ist eine klare Anweisung (ein Befehl)?", options: [
                        { text: "Gehe zwei Schritte vorwärts.", correct: true },
                        { text: "Das Wetter ist heute schön.", correct: false },
                        { text: "Roboter sind wirklich cool.", correct: false },
                        { text: "Ein rotes Auto.", correct: false }
                    ]},
                    { q: "Finde die versteckte Anweisung!", options: [
