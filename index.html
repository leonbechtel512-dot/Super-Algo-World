<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Super Algo World 3D - Regeln & Analyse</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @keyframes fadeInUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in-up { animation: fadeInUp 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { 0% { transform: scale(0.8); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
        .animate-pop-in { animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes float { 0%, 100% { transform: translateY(0px); } 50% { transform: translateY(-10px); } }
        .animate-float { animation: float 3s ease-in-out infinite; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
        .animate-shake { animation: shake 0.3s ease-in-out; }
        
        .btn-3d { transition: all 0.1s; box-shadow: 0 6px 0 rgba(0,0,0,0.2); }
        .btn-3d:active:not(:disabled) { transform: translateY(6px); box-shadow: 0 0px 0 rgba(0,0,0,0.2); }
        
        .island-3d { box-shadow: 0 10px 0 rgba(0,0,0,0.15); transition: transform 0.2s, box-shadow 0.2s; }
        .island-3d:hover:not(:disabled) { transform: translateY(-5px); box-shadow: 0 15px 0 rgba(0,0,0,0.15); }
        
        .glitch-text { text-shadow: 2px 2px #ff00ff, -2px -2px #00ffff; }
        .neon-text { color: #0ff; text-shadow: 0 0 5px #0ff, 0 0 10px #0ff; }

        .bg-screenshot-sky { background-color: #63bcf8; }
        .bg-screenshot-hill-light { background-color: #2ac754; }
        .bg-screenshot-hill-dark { background-color: #1ea041; }
        .text-screenshot-dark { color: #162032; }
        .bg-screenshot-dark { background-color: #162032; }
        .bg-screenshot-panel { background-color: #21324d; }
    </style>
</head>
<body class="bg-gray-100 overflow-x-hidden font-sans select-none">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const shuffleArray = (array) => {
            let newArr = [...array];
            for (let i = newArr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArr[i], newArr[j]] = [newArr[j], newArr[i]];
            }
            return newArr;
        };

        const sleep = (ms) => new Promise(r => setTimeout(r, ms));

        // --- UI HILFS-KOMPONENTEN ---
        const Button3D = ({ children, onClick, color = "blue", className = "", disabled = false }) => {
            const colors = {
                blue: "bg-blue-500 hover:bg-blue-400 text-white",
                green: "bg-green-500 hover:bg-green-400 text-white",
                red: "bg-red-500 hover:bg-red-400 text-white",
                yellow: "bg-yellow-400 hover:bg-yellow-300 text-yellow-900",
                purple: "bg-purple-500 hover:bg-purple-400 text-white",
                gray: "bg-gray-400 hover:bg-gray-300 text-white",
                orange: "bg-orange-500 hover:bg-orange-400 text-white",
                black: "bg-gray-900 hover:bg-gray-800 text-cyan-400 border-2 border-cyan-500",
            };
            return (
                <button onClick={onClick} disabled={disabled} className={`btn-3d w-full py-4 font-bold text-xl rounded-2xl ${colors[color]} ${disabled ? 'opacity-50 cursor-not-allowed transform-none shadow-none' : ''} ${className}`}>
                    {children}
                </button>
            );
        };

        const DialogBox = ({ title, icon, children, color = "blue" }) => {
            const styles = {
                blue: "bg-blue-50 border-blue-300 text-blue-800",
                yellow: "bg-yellow-50 border-yellow-300 text-yellow-800",
                red: "bg-red-50 border-red-300 text-red-800",
                green: "bg-green-50 border-green-300 text-green-800",
                purple: "bg-purple-50 border-purple-300 text-purple-800",
                teal: "bg-teal-50 border-teal-300 text-teal-800",
                orange: "bg-orange-50 border-orange-300 text-orange-800",
                black: "bg-gray-900 border-cyan-600 text-cyan-400"
            };
            const isNeon = color === 'black';
            return (
                <div className={`${styles[color].split(' ')[0]} p-6 rounded-3xl border-b-8 border-x-4 border-t-4 ${styles[color].split(' ')[1]} mb-6 shadow-lg`}>
                    <h3 className={`font-black text-2xl ${styles[color].split(' ')[2]} mb-4 flex items-center gap-3`}>
                        <i className={`fa-solid ${icon} text-3xl`}></i> {title}
                    </h3>
                    <div className={`space-y-4 ${isNeon?'font-mono text-cyan-200':'text-gray-700 font-medium'}`}>{children}</div>
                </div>
            );
        };

        const AlgoCharacter = () => (
            <div className="relative flex flex-col items-center animate-bounce z-50 hover:scale-110 transition-transform" style={{ filter: 'drop-shadow(0px 4px 2px rgba(0,0,0,0.3))' }}>
                <div className="absolute -top-6 bg-white text-[9px] font-black px-2 py-0.5 rounded-full border-2 border-emerald-400 text-emerald-600">Algo!</div>
                <div className="relative bg-yellow-50 w-10 h-14 border-[3px] border-gray-500 flex flex-col items-center pt-2 shadow-inner rounded-sm">
                    <div className="absolute -top-1 -right-1 w-0 h-0 border-l-[10px] border-l-transparent border-b-[10px] border-b-gray-400"></div>
                    <div className="absolute -top-1 -right-1 w-0 h-0 border-r-[10px] border-r-sky-300 border-t-[10px] border-t-sky-300"></div>
                    <div className="flex gap-1.5 mb-1"><div className="w-1.5 h-1.5 bg-black rounded-full"></div><div className="w-1.5 h-1.5 bg-black rounded-full"></div></div>
                    <div className="w-3 h-1.5 border-b-2 border-black rounded-full mb-1"></div>
                    <div className="w-6 h-0.5 bg-gray-300 mb-1 rounded"></div><div className="w-4 h-0.5 bg-gray-300 mb-1 rounded"></div><div className="w-5 h-0.5 bg-gray-300 rounded"></div>
                </div>
            </div>
        );

        // --- NEUE HILFS-KOMPONENTEN FÜR LEVEL UND BOSSE ---

        const MCLevel = ({ title, icon, color, text, options, onComplete }) => {
            const [opts, setOpts] = useState(() => shuffleArray(options));
            const [errorMsg, setErrorMsg] = useState('');
            const [selectedId, setSelectedId] = useState(null);
            const [isLocked, setIsLocked] = useState(false);

            const handlePick = async (opt) => {
                if(isLocked) return;
                setIsLocked(true);
                setSelectedId(opt.text);

                if(opt.correct) { 
                    setErrorMsg(''); 
                    await sleep(800);
                    onComplete(); 
                } else { 
                    setErrorMsg(opt.msg || 'Falsch! Denk noch einmal genau nach.'); 
                    await sleep(1200);
                    setSelectedId(null);
                    setOpts(shuffleArray([...opts])); 
                    setIsLocked(false);
                }
            };

            return (
                <div className="animate-pop-in">
                    <DialogBox title={title} icon={icon} color={color}>
                        <p className="mb-4">{text}</p>
                        <div className="space-y-3">
                            {opts.map((opt, i) => {
                                let btnStyle = "bg-white hover:bg-gray-50 border-gray-200 text-gray-800";
                                if (selectedId === opt.text) {
                                    btnStyle = opt.correct ? "bg-green-100 border-green-500 text-green-900" : "bg-red-100 border-red-500 text-red-900";
                                }
                                return (
                                    <button key={i} disabled={isLocked} onClick={()=>handlePick(opt)} className={`w-full p-4 rounded-xl border-4 font-bold text-left transition-all ${btnStyle}`}>
                                        {opt.text}
                                    </button>
                                );
                            })}
                        </div>
                    </DialogBox>
                    {errorMsg && <p className="text-center font-bold text-red-500 animate-pop-in">{errorMsg}</p>}
                </div>
            );
        };

        const MCBossGauntlet = ({ title, icon, colorClass, textClass, questions, onComplete }) => {
            const [stage, setStage] = useState(0);
            const [lives, setLives] = useState(3);
            const [opts, setOpts] = useState(() => shuffleArray(questions[0].options));
            const [status, setStatus] = useState('playing'); // playing, gameover, won
            const [msg, setMsg] = useState('');
            const [shake, setShake] = useState(false);
            const [selectedId, setSelectedId] = useState(null);
            const [isLocked, setIsLocked] = useState(false);

            const handlePick = async (opt) => {
                if (status !== 'playing' || isLocked) return;
                setIsLocked(true);
                setSelectedId(opt.text);
                
                if (opt.correct) {
                    setMsg('Richtig!');
                    await sleep(800);
                    if (stage < 2) {
                        setStage(s => s + 1);
                        setOpts(shuffleArray(questions[stage + 1].options));
                        setMsg('');
                        setSelectedId(null);
                        setIsLocked(false);
                    } else {
                        setStatus('won');
                    }
                } else {
                    setShake(true); setTimeout(() => setShake(false), 300);
                    setMsg('Falsch!');
                    await sleep(1000);
                    if (lives > 1) {
                        setLives(l => l - 1);
                        setMsg('Du verlierst ein Leben!');
                        setOpts(shuffleArray([...opts]));
                        setSelectedId(null);
                        setIsLocked(false);
                    } else {
                        setLives(0);
                        setStatus('gameover');
                    }
                }
            };

            const restart = () => {
                setLives(3); setStage(0); setStatus('playing'); setMsg('');
                setOpts(shuffleArray(questions[0].options));
                setSelectedId(null);
                setIsLocked(false);
            };

            if (status === 'won') {
                return (
                    <div className="text-center animate-pop-in mt-6">
                        <i className={`fa-solid fa-trophy text-7xl ${textClass} mb-4 animate-bounce`}></i>
                        <h2 className="text-3xl font-black mb-4">Boss besiegt!</h2>
                        <p className="text-gray-600 font-bold mb-6">Alle 3 Fragen richtig beantwortet!</p>
                        <Button3D color="purple" onClick={onComplete}>Weiter 🚀</Button3D>
                    </div>
                );
            }

            if (status === 'gameover') {
                return (
                    <div className="text-center animate-pop-in bg-red-100 p-8 rounded-3xl border-4 border-red-500">
                        <i className="fa-solid fa-skull-crossbones text-7xl text-red-500 mb-4 animate-float"></i>
                        <h2 className="text-3xl font-black mb-4 text-red-700">GAME OVER</h2>
                        <p className="text-red-900 font-bold mb-6">Du hast alle 3 Leben verloren. Der Boss hat dich besiegt!</p>
                        <Button3D color="red" onClick={restart}>Erneut Versuchen</Button3D>
                    </div>
                );
            }

            return (
                <div className={`text-center animate-pop-in ${shake ? 'animate-shake' : ''}`}>
                    <div className="flex justify-between items-center mb-2 px-4">
                        <div className="flex gap-1">
                            {[1, 2, 3].map(i => <i key={i} className={`fa-solid fa-heart text-2xl ${i <= lives ? 'text-red-500 animate-pulse' : 'text-gray-300'}`}></i>)}
                        </div>
                        <div className="font-black text-gray-500 bg-gray-200 px-3 py-1 rounded-full text-sm">Frage {stage + 1} / 3</div>
                    </div>

                    <i className={`fa-solid ${icon} text-6xl ${textClass} mb-2 animate-float block`}></i>
                    <h2 className="text-3xl font-black mb-4">{title}</h2>
                    
                    <p className={`${colorClass} p-4 rounded-2xl border-4 font-bold mb-6 text-sm text-left shadow-inner`}>
                        {questions[stage].q}
                    </p>

                    <div className="space-y-3 mb-6 text-left">
                        {opts.map((opt, i) => {
                            let btnStyle = "bg-white hover:border-gray-400 border-gray-300 text-gray-800";
                            if (selectedId === opt.text) {
                                btnStyle = opt.correct ? "border-green-500 bg-green-100 text-green-900" : "border-red-500 bg-red-100 text-red-900";
                            }
                            return (
                                <button key={i} disabled={isLocked} onClick={() => handlePick(opt)} className={`w-full p-4 rounded-2xl border-4 font-bold text-sm transition-colors ${btnStyle}`}>
                                    {opt.text}
                                </button>
                            );
                        })}
                    </div>

                    {msg && <p className={`font-black text-xl ${msg==='Richtig!' ? 'text-green-500' : 'text-red-500'}`}>{msg}</p>}
                </div>
            );
        };


        // --- LEVEL INHALTE ---

        // WELT 1: GRUNDLAGEN
        const L1_1 = ({ onComplete }) => (
            <div className="animate-pop-in">
                <DialogBox title="Der Algorithmus" icon="fa-scroll" color="green">
                    <p><b>Algo ruft:</b> "Willkommen! Ich bin Algo, der kleine Notizzettel. Ich helfe dir beim Programmieren!"</p>
                    <p>Ein <strong>Algorithmus</strong> ist eine <strong>Abfolge von Anweisungen</strong>, mit der man ein Problem löst.</p>
                    <p>Das ist wie ein Kochrezept, eine Bastelanleitung für Lego oder der Weg zur Schule. Jeder Schritt ist eine kleine, klare Anweisung.</p>
                </DialogBox>
                <Button3D color="green" onClick={onComplete}>Anweisungen verstehen! 👍</Button3D>
            </div>
        );
        const L1_2 = ({ onComplete }) => (
            <MCLevel 
                title="Abläufe im Alltag" icon="fa-calendar-day" color="yellow"
                text="Algo fragt: Ein Algorithmus ist ein Ablauf. Welches dieser Beispiele ist ein Ablauf, bei dem man die einzelnen Schritte auf keinen Fall vertauschen darf?"
                options={[
                    { text: "Ein Glas Wasser einschenken und austrinken.", correct: true },
                    { text: "Schulsachen in den Ranzen packen (Heft, Stifte, Buch).", correct: false, msg: "Ob du erst das Heft oder den Stift einpackst, ist für das Ergebnis egal." },
                    { text: "Das Zimmer aufräumen (Müll wegwerfen, Bett machen).", correct: false, msg: "Die Reihenfolge beim Aufräumen ist meistens egal." },
                    { text: "Freunde auf dem Schulhof begrüßen.", correct: false, msg: "Wen du zuerst begrüßt, ändert nichts am Ergebnis." }
                ]}
                onComplete={onComplete}
            />
        );
        const L1_3 = ({ onComplete }) => (
            <MCBossGauntlet
                title="Boss: Anweisungen erkennen" icon="fa-bullhorn" colorClass="bg-green-100 border-green-300 text-green-900" textClass="text-green-600"
                questions={[
                    { q: "Welche dieser Aussagen ist eine klare Anweisung (ein Befehl)?", options: [
                        { text: "Gehe zwei Schritte vorwärts.", correct: true },
                        { text: "Das Wetter ist heute schön.", correct: false },
                        { text: "Roboter sind wirklich cool.", correct: false },
                        { text: "Ein rotes Auto.", correct: false }
                    ]},
                    { q: "Finde die versteckte Anweisung!", options: [
                        { text: "Drehe dich um 90 Grad nach rechts.", correct: true },
                        { text: "In der Ecke liegt eine Socke.", correct: false },
                        { text: "Wo ist mein Schulbuch?", correct: false },
                        { text: "Ein Algorithmus ist eine Anleitung.", correct: false }
                    ]},
                    { q: "Welcher Satz gehört in einen funktionierenden Algorithmus?", options: [
                        { text: "Hebe den Gegenstand vor dir auf.", correct: true },
                        { text: "Das Zimmer ist sehr unordentlich.", correct: false },
                        { text: "Ich mag keine Mathematik.", correct: false },
                        { text: "Die Tür ist aus Holz.", correct: false }
                    ]}
                ]}
                onComplete={onComplete}
            />
        );

        // WELT 2: ROBOTER MISSION (PRAXIS)
        const L2_1 = ({ onComplete }) => (
            <div className="animate-pop-in">
                <DialogBox title="Roboter steuern" icon="fa-robot" color="orange">
                    <p><b>Algo erklärt:</b> "Computer und Roboter denken nicht selbst. Sie tun nur exakt das, was man ihnen als Anweisung gibt!"</p>
                    <p>Du lernst jetzt, wie man einen kleinen Roboter namens <b>Robbie</b> steuert. Er kennt nur ganz einfache Befehle wie "Gehe vorwärts" oder "Drehe rechts".</p>
                </DialogBox>
                <Button3D color="orange" onClick={onComplete}>Ich übernehme die Steuerung!</Button3D>
            </div>
        );
        const L2_2 = ({ onComplete }) => (
            <MCLevel 
                title="Code im Kopf lesen" icon="fa-brain" color="blue"
                text="Algo sagt: Robbie schaut nach oben. Was passiert, wenn er diesen Code abarbeitet: 1) Gehe 1 Feld vorwärts. 2) Drehe 90 Grad rechts. 3) Gehe 1 Feld vorwärts. 4) Drehe 90 Grad rechts. 5) Gehe 1 Feld vorwärts."
                options={[
                    { text: "Er steht genau rechts neben seinem Startpunkt.", correct: true },
                    { text: "Er steht wieder exakt auf seinem Startpunkt.", correct: false, msg: "Zeichne den Weg (Vor, Rechts, Vor, Rechts, Vor) mal mit dem Finger auf den Tisch!" },
                    { text: "Er steht zwei Felder vor seinem Startpunkt.", correct: false, msg: "Er ist zwischendurch abgebogen!" },
                    { text: "Er steht links neben seinem Startpunkt.", correct: false, msg: "Achte auf die Rechts-Drehungen!" }
                ]}
                onComplete={onComplete}
            />
        );
        const L2_3 = ({ onComplete }) => {
            const [stage, setStage] = useState(0);
            const [lives, setLives] = useState(3);
            const [seq, setSeq] = useState([]);
            const [status, setStatus] = useState('idle'); 
            const [msg, setMsg] = useState('');
            const [shake, setShake] = useState(false);

            const stages = [
                { target: {x: 2, y: 0}, start: {x: 0, y: 2} },
                { target: {x: 0, y: 0}, start: {x: 2, y: 2} },
                { target: {x: 1, y: 1}, start: {x: 0, y: 2} }
            ];
            const [pos, setPos] = useState(stages[0].start);

            const run = async () => {
                setStatus('running'); setMsg('');
                let cx = stages[stage].start.x, cy = stages[stage].start.y;
                setPos({x: cx, y: cy});
                await sleep(400);

                for (let cmd of seq) {
                    if (cmd === 'U') cy -= 1; if (cmd === 'D') cy += 1; if (cmd === 'L') cx -= 1; if (cmd === 'R') cx += 1;
                    setPos({x: cx, y: cy});
                    await sleep(400);
                    if (cx < 0 || cx > 2 || cy < 0 || cy > 2) { 
                        handleFail('Crash! Wand berührt!'); return; 
                    }
                }

                if (cx === stages[stage].target.x && cy === stages[stage].target.y) { 
                    setMsg('Ziel erreicht!');
                    setStatus('win');
                    await sleep(1000);
                    if (stage < 2) {
                        setStage(s => s + 1);
                        setPos(stages[stage+1].start);
                        setSeq([]);
                        setStatus('idle');
                        setMsg('');
                    } else {
                        setStatus('game_won');
                    }
                } else { 
                    handleFail('Ziel verfehlt!'); 
                }
            };

            const handleFail = (message) => {
                setShake(true); setTimeout(() => setShake(false), 300);
                if (lives > 1) {
                    setLives(l => l - 1);
                    setMsg(message + ' Du verlierst ein Leben!');
                    setStatus('fail');
                } else {
                    setLives(0);
                    setStatus('gameover');
                }
            };

            const reset = () => { setPos(stages[stage].start); setStatus('idle'); setMsg(''); setSeq([]); };
            const fullRestart = () => { setLives(3); setStage(0); setPos(stages[0].start); setStatus('idle'); setSeq([]); };
            
            const addCmd = (c) => { if(status === 'idle' && seq.length < 8) setSeq([...seq, c]); };
            const delCmd = () => { if(status === 'idle' && seq.length > 0) setSeq(seq.slice(0,-1)); };

            if (status === 'gameover') {
                return (
                    <div className="text-center animate-pop-in bg-red-100 p-8 rounded-3xl border-4 border-red-500">
                        <i className="fa-solid fa-skull-crossbones text-7xl text-red-500 mb-4 animate-float"></i>
                        <h2 className="text-3xl font-black mb-4 text-red-700">GAME OVER</h2>
                        <p className="text-red-900 font-bold mb-6">Du hast alle 3 Leben verloren. Der Boss hat dich besiegt!</p>
                        <Button3D color="red" onClick={fullRestart}>Erneut Versuchen</Button3D>
                    </div>
                );
            }

            if (status === 'game_won') {
                return (
                    <div className="animate-pop-in text-center mt-4">
                        <i className="fa-solid fa-trophy text-7xl text-yellow-500 mb-4 animate-bounce"></i>
                        <p className="text-green-600 font-black text-3xl mb-2">Perfekt navigiert!</p>
                        <p className="text-gray-600 font-bold mb-6">Boss in allen 3 Runden besiegt!</p>
                        <Button3D color="purple" onClick={onComplete}>Weiter 🚀</Button3D>
                    </div>
                );
            }

            return (
                <div className={`text-center animate-pop-in ${shake ? 'animate-shake' : ''}`}>
                    <div className="flex justify-between items-center mb-2 px-4">
                        <div className="flex gap-1">{[1, 2, 3].map(i => <i key={i} className={`fa-solid fa-heart text-2xl ${i <= lives ? 'text-red-500 animate-pulse' : 'text-gray-300'}`}></i>)}</div>
                        <div className="font-black text-gray-500 bg-gray-200 px-3 py-1 rounded-full text-sm">Runde {stage + 1} / 3</div>
                    </div>

                    <h2 className="text-3xl font-black mb-2 text-gray-800">Boss: Roboter Robbie</h2>
                    <p className="bg-gray-100 p-3 rounded-2xl border-4 border-gray-300 font-bold mb-4 text-xs md:text-sm text-left text-gray-700">
                        Baue einen Algorithmus! Führe den Roboter zur grünen Tür.
                    </p>
                    
                    <div className="relative mx-auto mb-4 bg-gray-800 border-4 border-gray-900 rounded-xl shadow-inner box-content overflow-hidden" style={{ width: '150px', height: '150px' }}>
                        <div className="absolute inset-0 grid grid-cols-3 grid-rows-3 pointer-events-none">
                            {[0,1,2,3,4,5,6,7,8].map(i => <div key={i} className="border-2 border-gray-500 bg-gray-700/30"></div>)}
                        </div>
                        <div className="absolute flex items-center justify-center bg-green-500 border-2 border-green-700" style={{ left: `${stages[stage].target.x * 50}px`, top: `${stages[stage].target.y * 50}px`, width: '50px', height: '50px' }}><i className="fa-solid fa-door-open text-white text-2xl"></i></div>
                        <div className="absolute flex items-center justify-center transition-all duration-400 ease-in-out z-10" style={{ left: `${pos.x * 50}px`, top: `${pos.y * 50}px`, width: '50px', height: '50px' }}><i className={`fa-solid ${status === 'fail' ? 'fa-explosion text-red-500 scale-125' : 'fa-robot text-cyan-400'} text-3xl drop-shadow-md`}></i></div>
                    </div>

                    <div className="bg-white border-2 border-gray-300 rounded-xl p-2 mb-4 min-h-[50px] flex items-center justify-start gap-1 flex-wrap shadow-inner text-xl">
                        {seq.length === 0 && <span className="text-gray-400 text-sm font-bold ml-2">Code leer...</span>}

        // --- WELT 9: ROBO-ARENA (MINI-GAME) ---
        const RoboArenaGame = ({ onComplete }) => {
            const [level, setLevel] = useState(1);
            const maxLevel = 18; 
            const size = Math.floor((level - 1) / 3) + 3;

            const [timeLeft, setTimeLeft] = useState(30);
            const [status, setStatus] = useState('start'); 
            const [failReason, setFailReason] = useState('');
            const [seq, setSeq] = useState([]);
            const [pos, setPos] = useState({x: 0, y: 0, dir: 90}); 
            const [target, setTarget] = useState({x: size-1, y: size-1});
            const [walls, setWalls] = useState([]);

            useEffect(() => { if (status === 'start') generateLevel(level); }, [level, status]);

            const generateLevel = (lvl) => {
                const s = Math.floor((lvl - 1) / 3) + 3;
                let path = new Set();
                let cx = 0, cy = 0;
                path.add(`0,0`);
                while (cx < s - 1 || cy < s - 1) {
                    if (cx === s - 1) cy++; else if (cy === s - 1) cx++; else { if (Math.random() < 0.5) cx++; else cy++; }
                    path.add(`${cx},${cy}`);
                }
                
                let newWalls = [];
                let numWalls = Math.floor(s * s * 0.25); 
                for (let i=0; i<200 && newWalls.length < numWalls; i++) {
                    let wx = Math.floor(Math.random() * s); let wy = Math.floor(Math.random() * s);
                    if (!path.has(`${wx},${wy}`) && !newWalls.some(w => w.x===wx && w.y===wy)) { newWalls.push({x: wx, y: wy}); }
                }
                setWalls(newWalls); setPos({x: 0, y: 0, dir: 90}); setTarget({x: s-1, y: s-1});
                setSeq([]); setTimeLeft(30); setStatus('playing');
            };

            useEffect(() => {
                let timer;
                if (status === 'playing' && timeLeft > 0) timer = setTimeout(() => setTimeLeft(t => t - 1), 1000);
                else if (status === 'playing' && timeLeft === 0) { setStatus('failed'); setFailReason('Zeit abgelaufen!'); }
                return () => clearTimeout(timer);
            }, [timeLeft, status]);

            const runCode = async () => {
                if (status !== 'playing') return;
                setStatus('running');
                let cx = 0, cy = 0, cdir = 90;
                setPos({x: cx, y: cy, dir: cdir});
                await sleep(300);

                for (let cmd of seq) {
                    if (cmd === 'V') {
                        let norm = ((cdir % 360) + 360) % 360;
                        if (norm === 0) cy -= 1; if (norm === 90) cx += 1; if (norm === 180) cy += 1; if (norm === 270) cx -= 1;
                    } else if (cmd === 'R') cdir += 90; else if (cmd === 'L') cdir -= 90;
                    setPos({x: cx, y: cy, dir: cdir});
                    await sleep(300);
                    if (cx < 0 || cx >= size || cy < 0 || cy >= size || walls.some(w => w.x === cx && w.y === cy)) {
                        setStatus('failed'); setFailReason('Crash! Wand oder Rand berührt.'); return;
                    }
                }
                if (cx === target.x && cy === target.y) { if (level === maxLevel) setStatus('won_game'); else setStatus('passed'); } 
                else { setStatus('failed'); setFailReason('Ziel nicht erreicht!'); }
            };

            const restartFromCheckpoint = () => { setLevel(Math.floor((level - 1) / 3) * 3 + 1); setStatus('start'); };
            const nextLevel = () => { setLevel(l => l + 1); setStatus('start'); };
            const addCmd = (c) => { if (seq.length < 25) setSeq([...seq, c]); };
            const delCmd = () => { if (seq.length > 0) setSeq(seq.slice(0, -1)); };

            if (status === 'won_game') {
                return (
                    <div className="text-center animate-pop-in">
                        <i className="fa-solid fa-trophy text-8xl text-yellow-400 mb-6 animate-float block drop-shadow-[0_0_15px_yellow]"></i>
                        <h2 className="text-5xl font-black mb-4 text-cyan-400 glitch-text font-mono">ARENA BEZWUNGEN!</h2>
                        <p className="text-white text-xl font-mono mb-8">Du hast alle 18 Level überstanden!</p>
                        <Button3D color="black" onClick={onComplete}>ZURÜCK ZUR KARTE</Button3D>
                    </div>
                );
            }

            return (
                <div className="w-full flex flex-col font-mono text-white animate-fade-in-up">
                    <div className="flex justify-between items-center bg-gray-900 border-2 border-cyan-500 rounded-xl p-4 mb-4 shadow-[0_0_10px_#00ffff]">
                        <div><p className="text-cyan-400 font-bold text-xl">Lvl {level}/18</p><p className="text-gray-400 text-xs">Grid: {size}x{size}</p></div>
                        <div className={`text-4xl font-black ${timeLeft <= 10 ? 'text-red-500 animate-pulse' : 'text-white'}`}>00:{timeLeft < 10 ? `0${timeLeft}` : timeLeft}</div>
                    </div>

                    {status === 'failed' && (
                        <div className="bg-red-900 border-4 border-red-500 p-6 rounded-xl text-center mb-4 animate-pop-in shadow-[0_0_20px_red]">
                            <p className="text-3xl font-black mb-2 text-white">GAME OVER</p>
                            <p className="text-red-300 font-bold mb-6">{failReason}</p>
                            <Button3D color="red" onClick={restartFromCheckpoint}>Zum Checkpoint (Lvl {Math.floor((level - 1) / 3) * 3 + 1})</Button3D>
                        </div>
                    )}

                    {status === 'passed' && (
                        <div className="bg-green-900 border-4 border-green-500 p-6 rounded-xl text-center mb-4 animate-pop-in shadow-[0_0_20px_#22c55e]">
                            <p className="text-3xl font-black mb-2 text-white">LEVEL GESCHAFFT!</p>
                            <p className="text-green-300 font-bold mb-6">Zeit übrig: {timeLeft}s</p>
                            <Button3D color="green" onClick={nextLevel}>Nächstes Level</Button3D>
                        </div>
                    )}

                    {(status === 'playing' || status === 'running') && (
                        <>
                            <div className="relative mx-auto bg-gray-700 border-4 border-gray-600 shadow-inner overflow-hidden mb-4" style={{ width: '100%', maxWidth: '350px', aspectRatio: '1/1' }}>
                                <div className="absolute inset-0 grid" style={{ gridTemplateColumns: `repeat(${size}, minmax(0, 1fr))` }}>
                                    {Array.from({length: size * size}).map((_, i) => {
                                        const x = i % size; const y = Math.floor(i / size);
                                        const isWall = walls.some(w => w.x === x && w.y === y);
                                        const isT = x === target.x && y === target.y;
                                        const isR = pos.x === x && pos.y === y;
                                        return (
                                            <div key={i} className={`border-2 border-cyan-800/60 relative flex items-center justify-center ${isWall ? 'bg-cyan-900/60' : 'bg-gray-800/80'}`}>
                                                {isWall && <i className="fa-solid fa-cube text-cyan-700/50"></i>}
                                                {isT && <i className="fa-solid fa-flag text-green-500 text-xl md:text-2xl animate-pulse drop-shadow-[0_0_5px_#22c55e]"></i>}
                                                {isR && <div className="absolute z-10 transition-all duration-300" style={{transform: `rotate(${pos.dir}deg)`}}><i className="fa-solid fa-robot text-cyan-400 text-2xl md:text-3xl drop-shadow-[0_0_8px_#00ffff]"></i></div>}
                                            </div>
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="bg-gray-900 border-2 border-gray-600 rounded-xl p-2 mb-4 min-h-[60px] flex items-center justify-start gap-1 flex-wrap">
                                {seq.map((c, i) => <span key={i} className="bg-cyan-900 border border-cyan-500 text-cyan-100 font-bold px-2 py-1 rounded text-sm">{c==='V'?'Vor':c==='R'?'Rechts':'Links'}</span>)}
                            </div>

                            <div className="space-y-2">
                                <div className="flex justify-center gap-2">
                                    <button onClick={()=>addCmd('V')} disabled={status==='running'} className="flex-1 bg-gray-800 hover:bg-gray-700 border-2 border-gray-600 p-2 rounded-xl flex flex-col items-center justify-center"><i className="fa-solid fa-arrow-up text-cyan-400 text-xl"></i><span className="text-[10px] text-cyan-100 font-bold mt-1 tracking-wider uppercase">Vor</span></button>
                                    <button onClick={()=>addCmd('L')} disabled={status==='running'} className="flex-1 bg-gray-800 hover:bg-gray-700 border-2 border-gray-600 p-2 rounded-xl flex flex-col items-center justify-center"><i className="fa-solid fa-arrow-rotate-left text-cyan-400 text-xl"></i><span className="text-[10px] text-cyan-100 font-bold mt-1 tracking-wider uppercase">Links</span></button>
                                    <button onClick={()=>addCmd('R')} disabled={status==='running'} className="flex-1 bg-gray-800 hover:bg-gray-700 border-2 border-gray-600 p-2 rounded-xl flex flex-col items-center justify-center"><i className="fa-solid fa-arrow-rotate-right text-cyan-400 text-xl"></i><span className="text-[10px] text-cyan-100 font-bold mt-1 tracking-wider uppercase">Rechts</span></button>
                                    <button onClick={delCmd} disabled={status==='running'||seq.length===0} className="w-16 bg-red-900/50 hover:bg-red-800 border-2 border-red-700 text-red-400 p-2 rounded-xl flex flex-col items-center justify-center"><i className="fa-solid fa-delete-left text-xl"></i><span className="text-[10px] font-bold mt-1 uppercase">Lösch</span></button>
                                </div>
                                <Button3D color="black" onClick={runCode} disabled={status==='running' || seq.length===0}>PROGRAMM STARTEN</Button3D>
                            </div>
                        </>
                    )}
                </div>
            );
        };


        // --- WELT DEFINITIONEN ---
        const WORLDS = [
            { id: 1, title: "Grundlagen", levels: [{n: "1-1", C: L1_1}, {n: "1-2", C: L1_2}, {n: "1-3", C: L1_3, boss: true}] },
            { id: 2, title: "Roboter-Mission", levels: [{n: "2-1", C: L2_1}, {n: "2-2", C: L2_2}, {n: "2-3", C: L2_3, boss: true}] },
            { id: 3, title: "Die 4 Regeln", levels: [{n: "3-1", C: L3_1}, {n: "3-2", C: L3_2}, {n: "3-3", C: L3_3, boss: true}] },
            { id: 4, title: "Regel: Eindeutig", levels: [{n: "4-1", C: L4_1}, {n: "4-2", C: L4_2}, {n: "4-3", C: L4_3, boss: true}] },
            { id: 5, title: "Regel: Ausführbar", levels: [{n: "5-1", C: L5_1}, {n: "5-2", C: L5_2}, {n: "5-3", C: L5_3, boss: true}] },
            { id: 6, title: "Regel: Reihenfolge", levels: [{n: "6-1", C: L6_1}, {n: "6-2", C: L6_2}, {n: "6-3", C: L6_3, boss: true}] },
            { id: 7, title: "Regel: Endlich", levels: [{n: "7-1", C: L7_1}, {n: "7-2", C: L7_2}, {n: "7-3", C: L7_3, boss: true}] },
            { id: 8, title: "Quiz-Welt", levels: [{n: "8-1", C: L8_1}, {n: "8-2", C: L8_2}, {n: "8-3", C: L8_3, boss: true}] },
            { id: 9, title: "Roboter-Arena", levels: [{n: "9-1", C: RoboArenaGame, boss: true}] },
        ];

        // --- HAUPT-APP ---
        const App = () => {
            const [maxUnlocked, setMaxUnlocked] = useState('1-1');
            const [view, setView] = useState('overview'); 
            const [activeWorldId, setActiveWorldId] = useState(1);
            const [activeLevelId, setActiveLevelId] = useState(null);
            
            const [showCheatModal, setShowCheatModal] = useState(false);
            const [cheatPw, setCheatPw] = useState('');

            const isUnlocked = (lvlId) => {
                const [w1, l1] = lvlId.split('-').map(Number);
                const [w2, l2] = maxUnlocked.split('-').map(Number);
                if (w1 < w2) return true;
                if (w1 === w2 && l1 <= l2) return true;
                return false;
            };
            const isCompleted = (lvlId) => {
                const [w1, l1] = lvlId.split('-').map(Number);
                const [w2, l2] = maxUnlocked.split('-').map(Number);
                if (w1 < w2) return true;
                if (w1 === w2 && l1 < l2) return true;
                return false;
            };
            const getNextLvl = (currId) => {
                let [w, l] = currId.split('-').map(Number);
                if(w === 9 && l === 1) return 'win'; 
                if(l < 3) return `${w}-${l+1}`;
                return `${w+1}-1`;
            };
            const onLevelComplete = () => {
                const nextId = getNextLvl(activeLevelId);
                if (nextId === 'win') { setView('win'); } 
                else {
                    const [nextW, nextL] = nextId.split('-').map(Number);
                    if (!isUnlocked(nextId)) setMaxUnlocked(nextId);
                    if (nextW > activeWorldId) { setView('overview'); } else { setView('world'); }
                }
            };
            const handleCheat = () => { if(cheatPw === 'Sonnenschein') { setMaxUnlocked('9-1'); setShowCheatModal(false); setCheatPw(''); } };

            const [maxW, maxL] = maxUnlocked.split('-').map(Number);
            const totalLevelsCompleted = ((maxW - 1) * 3) + (maxL - 1);
            const xp = totalLevelsCompleted * 10;

            if (view === 'win') {
                return (
                    <div className="min-h-screen bg-black flex items-center justify-center p-4">
                        <div className="bg-gray-900 p-12 rounded-[3rem] text-center max-w-2xl border-8 border-cyan-500 shadow-[0_0_50px_rgba(0,255,255,0.4)] animate-pop-in">
                            <i className="fa-solid fa-user-astronaut text-9xl mb-8 animate-float block neon-text"></i>
                            <h1 className="text-5xl font-black mb-6 neon-text font-mono glitch-text">ARENA BEZWUNGEN!</h1>
                            <p className="text-xl text-cyan-300 mb-8 font-mono">Du hast die Roboter-Arena gemeistert und bist eine absolute Programmier-Legende!</p>
                            <Button3D color="black" onClick={() => { setMaxUnlocked('1-1'); setActiveWorldId(1); setView('overview'); }}>NEUSTART</Button3D>
                        </div>
                    </div>
                );
            }

            if (view === 'level') {
                let LvlComp = null;
                WORLDS.forEach(w => w.levels.forEach(l => { if(l.n === activeLevelId) LvlComp = l.C; }));
                const isArena = activeWorldId === 9;
                return (
                    <div className={`min-h-screen ${isArena ? 'bg-black' : 'bg-screenshot-dark'} flex items-center justify-center p-4 md:p-8`}>
                        <div className={`w-full max-w-4xl bg-white rounded-[2rem] overflow-hidden animate-pop-in ${isArena ? 'border-8 border-cyan-600 shadow-[0_0_30px_#00ffff]' : ''}`}>
                            <div className={`p-4 flex justify-between items-center border-b-2 ${isArena ? 'bg-gray-900 border-cyan-500' : 'bg-gray-100 border-gray-200'}`}>
                                <button onClick={()=>setView('world')} className={`${isArena ? 'text-cyan-400 hover:text-white' : 'text-gray-600 hover:text-black'} font-bold flex items-center gap-2`}><i className="fa-solid fa-arrow-left"></i> Zurück zur Karte</button>
                                <h2 className={`font-black text-xl ${isArena ? 'text-cyan-400 font-mono glitch-text' : 'text-gray-800'}`}>LEVEL {activeLevelId}</h2>
                                <div className="w-32"></div>
                            </div>
                            <div className={`p-8 md:p-12 ${isArena ? 'bg-black' : ''}`}>{LvlComp && <LvlComp onComplete={onLevelComplete} />}</div>
                        </div>
                    </div>
                );
            }

            if (view === 'overview') {
                return (
                    <div className="min-h-screen bg-sky-300 pb-20 relative overflow-hidden">
                        {showCheatModal && (
                            <div className="fixed inset-0 bg-black/80 flex items-center justify-center z-[100] animate-pop-in p-4">
                                <div className="bg-white p-8 rounded-3xl max-w-sm w-full text-center shadow-[0_0_50px_rgba(255,255,0,0.5)]">
                                    <i className="fa-solid fa-sun text-6xl text-yellow-400 mb-4 animate-[spin_10s_linear_infinite]"></i>
                                    <h2 className="text-2xl font-black mb-4 text-yellow-600">Geheim-Menü</h2>
                                    <input type="password" value={cheatPw} onChange={(e) => setCheatPw(e.target.value)} placeholder="Passwort..." className="w-full p-4 text-xl border-4 border-yellow-300 rounded-xl mb-4 text-center" />
                                    <div className="flex gap-4">
                                        <button onClick={() => {setShowCheatModal(false); setCheatPw('');}} className="flex-1 bg-gray-200 font-bold py-3 rounded-xl">Abbrechen</button>
                                        <button onClick={handleCheat} className="flex-1 bg-yellow-400 font-bold py-3 rounded-xl">Freischalten</button>
                                    </div>
                                </div>
                            </div>
                        )}
                        <button onClick={() => setShowCheatModal(true)} className="absolute top-4 right-4 text-yellow-400 opacity-30 hover:opacity-100 hover:rotate-180 transition-all duration-500 z-50 text-4xl cursor-pointer"><i className="fa-solid fa-sun"></i></button>
                        <div className="absolute top-10 left-10 text-white/50 text-8xl animate-float" style={{animationDelay: '0s'}}><i className="fa-solid fa-cloud"></i></div>
                        <div className="absolute top-40 right-20 text-white/50 text-9xl animate-float" style={{animationDelay: '1s'}}><i className="fa-solid fa-cloud"></i></div>

                        <div className="max-w-6xl mx-auto p-4 md:p-8 relative z-10 animate-fade-in-up">
                            <div className="bg-white/90 p-6 rounded-[2rem] shadow-xl border-b-8 border-white mb-12 text-center inline-block mx-auto transform -rotate-2">
                                <h1 className="text-5xl md:text-7xl font-black text-blue-600 tracking-tighter drop-shadow-md">Super Algo World <span className="text-green-500">3D</span></h1>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 max-w-5xl mx-auto">
                                {WORLDS.map((w, i) => {
                                    const wUnlocked = isUnlocked(`${w.id}-1`);
                                    const isArena = w.id === 9;
                                    return (
                                        <button 
                                            key={w.id} disabled={!wUnlocked} onClick={() => { setActiveWorldId(w.id); setView('world'); }}
                                            className={`island-3d relative flex flex-col items-center p-6 rounded-[2.5rem] bg-gradient-to-b ${wUnlocked ? (isArena ? 'from-gray-800 to-black' : 'from-blue-400 to-blue-600') : 'from-gray-400 to-gray-600'} ${isArena && wUnlocked ? 'shadow-[0_0_20px_rgba(0,255,255,0.4)] border-cyan-500' : ''} text-white border-4 ${wUnlocked && !isArena ? 'border-white/50' : (!wUnlocked ? 'border-gray-500' : '')} ${wUnlocked ? 'cursor-pointer hover:brightness-110' : 'cursor-not-allowed opacity-80'} `}
                                            style={{ animationDelay: `${i * 100}ms` }}
                                        >
                                            <div className={`w-20 h-20 rounded-full flex items-center justify-center text-4xl shadow-inner mb-4 backdrop-blur-sm ${isArena ? 'bg-gray-900 border-2 border-cyan-500 text-cyan-400' : 'bg-white/20'}`}>
                                                {wUnlocked ? (isArena ? <i className="fa-solid fa-robot"></i> : <span className="font-black">{w.id}</span>) : <i className="fa-solid fa-lock text-gray-300"></i>}
                                            </div>
                                            <h2 className={`font-black text-2xl mb-2 drop-shadow-md text-center ${isArena ? 'neon-text font-mono glitch-text' : ''}`}>{w.title}</h2>
                                            
                                            {/* Algo auf der Karte anzeigen */}
                                            {wUnlocked && activeWorldId === w.id && (
                                                <div className="absolute -top-12 left-1/2 transform -translate-x-1/2 z-50 pointer-events-none">
                                                    <AlgoCharacter />
                                                </div>
                                            )}

                                            {wUnlocked && maxUnlocked.startsWith(`${w.id}-`) && (
                                                <div className={`absolute -top-4 -right-4 text-white font-black px-4 py-2 rounded-full shadow-lg animate-bounce border-2 ${isArena ? 'bg-black border-cyan-500 text-cyan-400' : 'bg-red-500 border-white'}`}>
                                                    HIER!
                                                </div>
                                            )}
                                        </button>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            }

            const W = WORLDS.find(w => w.id === activeWorldId);
            const isArena = W.id === 9;
            let worldProgress = 0;
            if (maxW > W.id) worldProgress = 100;
            else if (maxW === W.id) worldProgress = Math.round(((maxL - 1) / W.levels.length) * 100);
            const nodePos = [ { left: '20%', top: '75%' }, { left: '50%', top: '50%' }, { left: '75%', top: '25%' } ];

            return (
                <div className={`min-h-screen ${isArena ? 'bg-black' : 'bg-screenshot-dark'} flex flex-col font-sans`}>
                    <div className={`${isArena ? 'bg-gray-900 border-b border-cyan-600' : 'bg-white'} h-20 w-full flex items-center justify-between px-4 md:px-6 shadow-md z-50`}>
                        <div className="flex items-center gap-4">
                            <button onClick={()=>setView('overview')} className={`${isArena ? 'bg-gray-800 text-cyan-500 border border-cyan-700' : 'bg-gray-200 hover:bg-gray-300 text-gray-700'} w-12 h-12 rounded-xl flex items-center justify-center font-black text-xl shadow-sm transition-colors`}><i className="fa-solid fa-list"></i></button>
                            <h1 className={`${isArena ? 'neon-text font-mono' : 'text-screenshot-dark'} font-black text-xl md:text-2xl tracking-wide hidden md:block`}>{W.title}</h1>
                        </div>
                        {!isArena && (
                            <div className="flex items-center gap-4">
                                <div className="text-right"><div className="font-black text-screenshot-dark text-sm leading-tight">LEVEL {maxW}</div><div className="text-xs text-gray-500 font-bold">{xp} / 240 XP</div></div>
                                <div className="w-24 md:w-40 h-6 bg-screenshot-panel rounded-full overflow-hidden border border-gray-300"><div className="h-full bg-blue-500" style={{ width: `${(xp/240)*100}%` }}></div></div>
                            </div>
                        )}
                    </div>

                    <div className="flex-1 flex items-center justify-center p-4 md:p-6 relative">
                        <div className={`${isArena ? 'bg-gray-900 border-cyan-600 shadow-[0_0_30px_#00ffff]' : 'bg-screenshot-sky border-screenshot-panel shadow-2xl'} w-full max-w-4xl aspect-square md:aspect-video rounded-[2.5rem] relative overflow-hidden border-4`}>
                            {!isArena && (
                                <>
                                    <div className="absolute top-20 left-[15%] w-32 h-12 bg-white/80 rounded-full blur-[2px]"></div>
                                    <div className="absolute top-[40%] right-[10%] w-24 h-10 bg-white/80 rounded-full blur-[2px]"></div>
                                    <div className="absolute bottom-20 right-[25%] w-32 h-12 bg-white/80 rounded-full blur-[2px]"></div>
                                    <div className="absolute -bottom-32 -left-10 w-[120%] h-64 bg-screenshot-hill-light rounded-[100%]"></div>
                                    <div className="absolute -bottom-20 -right-20 w-96 h-64 bg-screenshot-hill-dark rounded-[100%]"></div>
                                    <div className="absolute -bottom-10 left-10 w-64 h-40 bg-screenshot-hill-dark rounded-[100%]"></div>
                                </>
                            )}
                            {isArena && <div className="absolute inset-0 opacity-30 pointer-events-none" style={{ backgroundImage: 'linear-gradient(rgba(0, 255, 255, 0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 255, 255, 0.2) 1px, transparent 1px)', backgroundSize: '40px 40px', transform: 'perspective(500px) rotateX(60deg) translateY(50px) translateZ(-200px)', transformOrigin: 'bottom' }}></div>}

                            <div className="absolute top-4 left-4 z-30 flex flex-col gap-2 items-start">
                                <div className={`${isArena ? 'bg-black text-cyan-400 border-cyan-600 shadow-[0_0_10px_#00ffff]' : 'bg-screenshot-panel text-white border-gray-600'} font-black px-4 py-2 rounded-lg shadow-md uppercase tracking-widest text-xs md:text-sm border`}>WELT {W.id}: {W.title}</div>
                                <div className={`${isArena ? 'bg-black text-cyan-400 border-cyan-600' : 'bg-white text-screenshot-dark border-gray-300'} font-black px-3 py-2 md:px-4 md:py-3 rounded-xl shadow-md w-40 md:w-48 border`}>
                                    <div className="flex justify-between text-[10px] md:text-xs mb-2"><span>FORTSCHRITT</span><span>{worldProgress}%</span></div>
                                    <div className={`w-full h-3 rounded-full overflow-hidden p-[1px] ${isArena ? 'bg-gray-900 border border-cyan-800' : 'bg-white border-2 border-gray-400'}`}><div className={`h-full rounded-full ${isArena ? 'bg-cyan-500 shadow-[0_0_5px_#00ffff]' : 'bg-gray-400'}`} style={{width: `${worldProgress}%`}}></div></div>
                                </div>
                            </div>

                            {W.id > 1 && <button onClick={()=>setActiveWorldId(w=>w-1)} className={`absolute left-2 md:left-4 top-1/2 -translate-y-1/2 w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center font-bold shadow-md z-40 transition-colors ${isArena ? 'bg-gray-800 text-cyan-500 hover:bg-black border border-cyan-500' : 'bg-white/80 hover:bg-white'}`}><i className="fa-solid fa-chevron-left"></i></button>}
                            {W.id < 9 && isUnlocked(`${W.id+1}-1`) && <button onClick={()=>setActiveWorldId(w=>w+1)} className={`absolute right-2 md:right-4 top-1/2 -translate-y-1/2 w-10 h-10 md:w-12 md:h-12 rounded-full flex items-center justify-center font-bold shadow-md z-40 transition-colors ${isArena ? 'bg-gray-800 text-cyan-500 hover:bg-black border border-cyan-500' : 'bg-white/80 hover:bg-white'}`}><i className="fa-solid fa-chevron-right"></i></button>}

                            {!isArena && (
                                <svg className="absolute inset-0 w-full h-full pointer-events-none z-10">
                                    <line x1={nodePos[0].left} y1={nodePos[0].top} x2={nodePos[1].left} y2={nodePos[1].top} stroke="#eab308" strokeWidth="6" strokeDasharray="8 8" strokeLinecap="round" />
                                    <line x1={nodePos[0].left} y1={nodePos[0].top} x2={nodePos[1].left} y2={nodePos[1].top} stroke="#ca8a04" strokeWidth="6" strokeDasharray="8 8" transform="translate(0, 3)" className="opacity-60" />
                                    <line x1={nodePos[1].left} y1={nodePos[1].top} x2={nodePos[2].left} y2={nodePos[2].top} stroke="#eab308" strokeWidth="6" strokeDasharray="8 8" strokeLinecap="round" />
                                    <line x1={nodePos[1].left} y1={nodePos[1].top} x2={nodePos[2].left} y2={nodePos[2].top} stroke="#ca8a04" strokeWidth="6" strokeDasharray="8 8" transform="translate(0, 3)" className="opacity-60" />
                                </svg>
                            )}

                            {W.levels.map((l, idx) => {
                                const unl = isUnlocked(l.n);
                                const comp = isCompleted(l.n);
                                const curr = l.n === maxUnlocked;
                                const isAlgoHere = (W.id === maxW && (idx + 1) === maxL) || (W.id < maxW && idx === W.levels.length - 1);
                                const pos = isArena ? { left: '50%', top: '50%' } : nodePos[idx];

                                return (
                                    <div key={l.n} className="absolute z-20 transform -translate-x-1/2 -translate-y-1/2" style={pos}>
                                        {idx === 0 && !isArena && <div className="absolute -bottom-8 -left-8 bg-red-600 text-white font-black text-xs px-2 py-1 transform -rotate-12 border-2 border-white rounded shadow-md z-30 pointer-events-none">START</div>}
                                        {isAlgoHere && <div className="absolute bottom-full left-1/2 transform -translate-x-1/2 mb-1 z-50 pointer-events-none"><AlgoCharacter /></div>}
                                        <button 
                                            disabled={!unl} onClick={() => { setActiveLevelId(l.n); setView('level'); }}
                                            className={`relative flex items-center justify-center transition-transform hover:scale-110 shadow-lg 
                                                ${l.boss ? (isArena ? 'w-32 h-32 rounded-3xl bg-black border-[4px] border-cyan-500 shadow-[0_0_20px_#00ffff]' : 'w-20 h-20 rounded-2xl bg-screenshot-panel border-[3px] border-gray-600') : 'w-14 h-14 rounded-full bg-white/50 border-[5px] border-gray-300'}
                                                ${curr && !l.boss ? 'ring-[6px] ring-yellow-400 bg-white border-yellow-500' : ''}
                                                ${comp && !l.boss ? 'bg-gray-200 border-gray-400' : ''}`}
                                        >
                                            {curr && !l.boss && <div className="w-10 h-10 bg-yellow-400 rounded-full flex items-center justify-center text-screenshot-dark pl-1"><i className="fa-solid fa-play"></i></div>}
                                            {!curr && !comp && !l.boss && <i className="fa-solid fa-lock text-gray-400 text-lg"></i>}
                                            {comp && !l.boss && <i className="fa-solid fa-check text-gray-500 text-lg"></i>}
                                            
                                            {l.boss && (
                                                <div className="flex flex-col items-center justify-center opacity-80">
                                                    <i className={`fa-solid ${isArena ? 'fa-robot text-cyan-400 text-5xl drop-shadow-[0_0_8px_#00ffff]' : 'fa-brands fa-fort-awesome text-3xl text-gray-400'}`}></i>
                                                    {!unl && !isArena && <i className="fa-solid fa-lock absolute -top-3 -right-3 text-gray-400 bg-screenshot-panel rounded-full p-1 border border-gray-600 text-xs"></i>}
                                                </div>
                                            )}
                                        </button>
                                        <div className={`absolute -bottom-8 left-1/2 transform -translate-x-1/2 whitespace-nowrap text-xs font-bold px-3 py-1 rounded-full pointer-events-none ${isArena ? 'bg-black text-cyan-400 border border-cyan-600' : 'bg-gray-900/80 text-white'}`}>
                                            {isArena ? 'ARENA STARTEN' : (l.boss ? 'Boss-Burg' : `Level ${idx + 1}`)}
                                        </div>
                                    </div>
                                )
                            })}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
